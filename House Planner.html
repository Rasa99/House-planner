<style>/* src/theme.css */
/* House Planner - theme.css (shared design tokens; owned by integration)
   The plan colours come from Rasa's reference DXF via the old generator;
   the interface colours are the old generator's panel palette.            */
:root {
  --bg: #0f1620;          /* canvas / plan background */
  --panel: #151d28;
  --panel2: #1b2735;
  --panel3: #223042;
  --line: #26313f;
  --line2: #33414f;
  --ink: #dfe6ef;
  --ink2: #b4bfcd;
  --muted: #7c8798;
  --accent: #16b6c9;      /* the dimension cyan */
  --accent-ink: #06222a;
  --accent-dim: #0e5f6c;
  --good: #4bbf7a;
  --warn: #e0a542;
  --bad: #e5534b;
  --wall: #a04040;
  --glass: #2e9bd6;
  --label: #9a9ae4;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 10px 28px rgba(0, 0, 0, .38);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --topbar-h: 52px;
  --status-h: 30px;
  --palette-w: 232px;
  --sidebar-w: 300px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
#app { display: grid; height: 100vh; overflow: hidden;
  grid-template-columns: var(--palette-w) 1fr var(--sidebar-w);
  grid-template-rows: var(--topbar-h) 1fr var(--status-h);
  grid-template-areas: "top top top" "palette stage sidebar" "status status status"; }
#topbar { grid-area: top; }
#palette { grid-area: palette; min-height: 0; }
#stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#sidebar { grid-area: sidebar; min-height: 0; }
#statusbar { grid-area: status; }

</style>
<style>/* src/app.css */
/* House Planner - app.css (canvas agent): the drawing board and its overlays.
   Uses the tokens in theme.css. ASCII only (escapes for any symbol).          */

.hp-stage { background: var(--bg); user-select: none; -webkit-user-select: none; }

.hp-board {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  display: block; touch-action: none; outline: none; cursor: default;
}
.hp-board:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-dim); }

.hp-ov {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  font-family: var(--sans); z-index: 2;
}

/* ---------------------------------------------------------------- chips */
.hp-chip {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  margin: 0; will-change: transform;
  translate: -50% -50%;
  border-radius: 9px; line-height: 1;
}
/* live size read-outs while a wall moves: big and legible */
.hp-chip--size {
  font: 650 17px/1 var(--mono); letter-spacing: .02em;
  color: var(--accent-ink); background: var(--accent);
  padding: 7px 11px 7px 11px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .18) inset;
  font-variant-numeric: tabular-nums;
}
.hp-chip--size.has-arrow-h::before,
.hp-chip--size.has-arrow-v::before {
  content: ""; display: inline-block; width: 16px; height: 10px; margin-right: 7px;
  vertical-align: -1px; background: currentColor; opacity: .75;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 10'><path d='M0 5 L4 1 L4 4 L12 4 L12 1 L16 5 L12 9 L12 6 L4 6 L4 9 Z' fill='black'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 10'><path d='M0 5 L4 1 L4 4 L12 4 L12 1 L16 5 L12 9 L12 6 L4 6 L4 9 Z' fill='black'/></svg>") center / contain no-repeat;
}
.hp-chip--size.has-arrow-v::before { rotate: 90deg; width: 14px; }

/* why something can't go there (red ghost) */
.hp-chip--reason {
  font: 600 13px/1.3 var(--sans); color: #fff;
  background: rgba(196, 52, 46, .96);
  padding: 7px 11px; max-width: 300px; white-space: normal;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
}
.hp-chip--reason.is-left { translate: 0 0; }

/* "Swap with Kitchen" while a room's name is dragged onto another room */
.hp-chip--swap {
  font: 650 13px/1 var(--sans); color: #1b1306;
  background: var(--warn); padding: 7px 11px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
}

/* edge lengths of the land, opening widths while dragging */
.hp-chip--edge {
  font: 600 12px/1 var(--mono); color: var(--ink2);
  background: rgba(21, 29, 40, .92); border: 1px solid var(--line2);
  padding: 4px 7px; border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
.hp-chip--edge.is-street { color: var(--accent); border-color: var(--accent-dim); }

/* ---------------------------------------------------------------- hover hint */
.hp-tip {
  position: absolute; left: 0; top: 0; max-width: 290px;
  font: 500 12.5px/1.35 var(--sans); color: var(--ink);
  background: rgba(27, 39, 53, .97); border: 1px solid var(--line2);
  padding: 7px 10px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  opacity: 0; transition: opacity .14s ease; visibility: hidden;
}
.hp-tip.is-on { opacity: 1; visibility: visible; }

/* ---------------------------------------------------------------- empty plan */
.hp-empty {
  position: absolute; left: 0; top: 0; translate: -50% -50%;
  text-align: center; max-width: 340px; padding: 18px 22px;
  border: 1.5px dashed rgba(22, 182, 201, .38); border-radius: 14px;
  background: rgba(15, 22, 32, .72);
  opacity: 0; visibility: hidden; transition: opacity .2s ease;
}
.hp-empty.is-on { opacity: 1; visibility: visible; }
.hp-empty__big { font: 600 16px/1.35 var(--sans); color: var(--ink); }
.hp-empty__small { margin-top: 6px; font: 400 13px/1.4 var(--sans); color: var(--muted); }

/* ---------------------------------------------------------------- context menu */
.hp-menu {
  position: absolute; left: 0; top: 0; min-width: 210px;
  pointer-events: auto; padding: 5px;
  background: var(--panel2); border: 1px solid var(--line2);
  border-radius: var(--radius); box-shadow: var(--shadow);
  display: none;
}
.hp-menu.is-on { display: block; }
.hp-menu__item {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  width: 100%; padding: 8px 10px; border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--ink);
  font: 500 13.5px/1.2 var(--sans); text-align: left; cursor: pointer;
}
.hp-menu__item:hover, .hp-menu__item:focus-visible { background: var(--panel3); outline: none; }
.hp-menu__item:disabled { color: var(--muted); cursor: default; background: transparent; opacity: .6; }
.hp-menu__item.is-bad { color: #f08a84; }
.hp-menu__item.is-bad:hover { background: rgba(229, 83, 75, .14); }
.hp-menu__item kbd {
  font: 500 11px/1 var(--mono); color: var(--muted);
  border: 1px solid var(--line2); border-radius: 5px; padding: 3px 5px;
}
.hp-menu__sep { height: 1px; margin: 4px 6px; background: var(--line); }

</style>
<style>/* src/panels.css */
/* House Planner - panels.css  (owner: panels agent)
   Top bar, palette, sidebar cards, status bar, toasts, tooltips, help, dialog.
   Uses only theme.css tokens and built-in fonts. Every class starts "pn-".   */

/* ------------------------------------------------------------ shared bits */
.pn-ic { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; display: block; }
.pn-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pn-hidden { display: none; }

  border: 1px solid var(--line2); border-bottom-width: 2px; background: var(--panel3); color: var(--ink); }

/* ------------------------------------------------------------ top bar */

  color: var(--accent-ink); background: linear-gradient(150deg, #3fd3e2, var(--accent) 55%, #0f8fa0);
  box-shadow: 0 2px 10px rgba(22, 182, 201, .25); }

.pn-title-in { width: 100%; height: 34px; padding: 0 30px 0 9px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--ink);
  font: 600 14.5px var(--sans); text-overflow: ellipsis; outline: none; transition: border-color .12s, background .12s; }
.pn-title-in:hover { border-color: var(--line2); background: var(--panel2); }
.pn-title-in:focus { border-color: var(--accent); background: var(--bg); box-shadow: 0 0 0 3px rgba(22, 182, 201, .16); }
.pn-title-pen { position: absolute; right: 10px; color: var(--muted); opacity: 0; pointer-events: none; transition: opacity .12s; }
.pn-title:hover .pn-title-pen { opacity: 1; }
.pn-title-in:focus + .pn-title-pen { opacity: 0; }
.pn-grow { flex: 1 1 0; min-width: 4px; }
.pn-tgroup { display: flex; align-items: center; gap: 2px; flex: none; }
.pn-tsep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; flex: none; }
.pn-tb { height: 34px; padding: 0 11px; display: inline-flex; align-items: center; gap: 7px;
  border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink2);

  transition: background .12s, color .12s, border-color .12s; }

.pn-tb.is-on { background: var(--panel3); color: var(--ink); border-color: var(--line2); }
.pn-tb-icon { width: 36px; padding: 0; justify-content: center; }

.pn-tb-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pn-tb-primary:hover:not(:disabled) { background: #2ccbdd; color: var(--accent-ink); border-color: #2ccbdd; }
.pn-tb-primary .pn-ic { stroke-width: 2.1; }
.pn-export { gap: 0; margin-left: 6px; }

.pn-unit-b:hover { color: var(--ink); }
.pn-unit-b.is-on { color: var(--accent); background: rgba(22, 182, 201, .13); }
@media (max-width: 1320px) { .pn-files .pn-tb .pn-tb-l { display: none; }
  .pn-files .pn-tb { width: 36px; padding: 0; justify-content: center; } }
@media (max-width: 1080px) { .pn-brand-n { display: none; } .pn-title { margin-left: 2px; } }

/* ------------------------------------------------------------ palette */
.pn-palette { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; }

  border: 1px dashed var(--line2); background: rgba(22, 182, 201, .05); color: var(--ink2); font-size: 12.5px; }

.pn-pal-gt { font-size: 10.5px; font-weight: 650; letter-spacing: .15em; text-transform: uppercase;
  color: var(--muted); margin: 0 2px 8px; }
.pn-tiles { display: grid; gap: 8px; }
.pn-tiles-1 { grid-template-columns: 1fr; }
.pn-tiles-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pn-tiles-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pn-tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 11px 6px 9px; min-width: 0; border-radius: 10px; border: 1px solid var(--line);
  background-color: var(--panel2); color: var(--ink); cursor: grab; user-select: none; -webkit-user-select: none;
  touch-action: none; transition: border-color .12s, background-color .12s, transform .12s, box-shadow .12s; }

  transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
.pn-tile:active, .pn-tile.is-press { transform: scale(.97); box-shadow: none; cursor: grabbing; }
.pn-tile-p { display: block; line-height: 0; pointer-events: none; }
.pn-pict { width: 40px; height: 40px; fill: none; stroke: var(--tint); stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.pn-pict .f { fill: var(--tint); stroke: none; }
.pn-pict .d { stroke-width: 1.2; stroke-dasharray: 2.5 2.5; opacity: .8; }

/* segmented buttons, chips, buttons */

.pn-btnrow { display: flex; gap: 6px; }

.pn-actions { display: flex; gap: 8px; padding-top: 2px; }
.pn-actions .pn-btn { flex: 1; }
.pn-icon-btn { width: 26px; height: 26px; display: grid; place-items: center; flex: none; padding: 0;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }

/* inspector bits */
.pn-roomhead { display: flex; align-items: center; gap: 8px; }

.pn-prob .pn-ic { color: var(--bad); margin-top: 1px; }
.pn-prob b { display: block; color: #ffd6d2; font-weight: 600; }
.pn-prob small { display: block; font-size: 11.5px; color: #e9a19c; }
.pn-msg { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; }
.pn-msg .pn-ic { margin-top: 1px; }
.pn-msg.is-warn, .pn-msg.is-info { background: rgba(224, 165, 66, .09); border: 1px solid rgba(224, 165, 66, .33); color: #f1cd8e; }

/* rules */
.pn-rules { display: flex; flex-direction: column; gap: 1px; margin: 0 -6px; }

.pn-badge.is-ok { color: var(--good); background: rgba(75, 191, 122, .11); border-color: rgba(75, 191, 122, .35); }

.pn-toggle-row { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }

.pn-edge.is-street .pn-band { fill: #2b3442; }
.pn-edge.is-neighbour .pn-band { fill: url(#pn-nb-hatch); }
.pn-band { stroke: transparent; stroke-width: 1; transition: fill .12s, stroke .12s; }
.pn-band-mid { stroke: #8a93a3; stroke-width: 1; stroke-dasharray: 5 4; opacity: .65; }
.pn-edge-line { stroke-width: 2.2; stroke-linecap: round; transition: stroke .12s; }
.pn-edge.is-street .pn-edge-line { stroke: #cfd6e4; }
.pn-edge.is-neighbour .pn-edge-line { stroke: #66778e; }
.pn-band-t { font: 700 8.5px var(--sans); letter-spacing: .16em; fill: #dfe6ef; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pn-edge.is-neighbour .pn-band-t { font-weight: 600; letter-spacing: .03em; fill: #9aa6b6; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }

.pn-street-sum { font-size: 12.5px; color: var(--ink); line-height: 1.4; }

/* ------------------------------------------------------------ status bar */
.pn-status { display: flex; align-items: center; padding: 0 10px 0 8px; min-width: 0; overflow: hidden; white-space: nowrap;
  background: var(--panel); border-top: 1px solid var(--line); font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink2); }
.pn-sbadge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 9px; margin-right: 6px; flex: none;
  border-radius: 999px; border: 1px solid; font: 650 11px var(--sans); cursor: pointer; background: none; }
.pn-sbadge .pn-ic { stroke-width: 2.4; }
.pn-sbadge.is-ok { color: var(--good); background: rgba(75, 191, 122, .1); border-color: rgba(75, 191, 122, .35); }

.pn-smsg { margin-left: auto; padding-left: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  font: 12px var(--sans); color: var(--ink2); transition: opacity .4s; }
.pn-smsg.is-ok { color: var(--good); }
.pn-smsg.is-warn { color: var(--warn); }
.pn-smsg.is-error { color: #f08a84; }
.pn-smsg.is-old { opacity: .5; }

/* ------------------------------------------------------------ toasts */
.pn-toasts { position: fixed; left: 50%; bottom: calc(var(--status-h) + 18px); transform: translateX(-50%); z-index: 50;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.pn-toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(560px, 88vw);
  padding: 10px 16px 10px 12px; border-radius: 10px; background: rgba(27, 39, 53, .97); border: 1px solid var(--line2);
  box-shadow: var(--shadow); color: var(--ink); font: 13px/1.4 var(--sans); cursor: pointer; animation: pn-in .18s ease-out; }
.pn-toast.is-ok { border-color: rgba(75, 191, 122, .45); } .pn-toast.is-ok .pn-ic { color: var(--good); }
.pn-toast.is-info { border-color: rgba(22, 182, 201, .4); } .pn-toast.is-info .pn-ic { color: var(--accent); }
.pn-toast.is-warn { border-color: rgba(224, 165, 66, .5); } .pn-toast.is-warn .pn-ic { color: var(--warn); }
.pn-toast.is-error { border-color: rgba(229, 83, 75, .55); } .pn-toast.is-error .pn-ic { color: var(--bad); }
.pn-toast.is-out { animation: pn-out .2s ease-in forwards; }
@keyframes pn-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pn-out { to { opacity: 0; transform: translateY(6px); } }
@keyframes pn-fade { from { opacity: 0; } to { opacity: 1; } }

/* ------------------------------------------------------------ tooltips */
.pn-tipbox { position: fixed; left: -9999px; top: 0; z-index: 60; max-width: 270px; padding: 8px 11px; border-radius: 8px;
  background: #0b1118; border: 1px solid var(--line2); box-shadow: var(--shadow); color: var(--ink2);
  font: 12px/1.45 var(--sans); pointer-events: none; opacity: 0; transform: translateY(2px);
  transition: opacity .12s, transform .12s; display: flex; flex-direction: column; gap: 3px; }
.pn-tipbox.is-on { opacity: 1; transform: none; }
.pn-tipbox:not(.is-multi) { flex-direction: row; align-items: center; gap: 9px; color: var(--ink); }
.pn-tipbox b { color: var(--ink); font-size: 12.5px; font-weight: 650; }
.pn-tipbox.is-multi kbd { align-self: flex-start; margin-top: 3px; }

/* ------------------------------------------------------------ help popover */
.pn-pop { position: fixed; z-index: 55; width: 380px; max-width: calc(100vw - 16px); padding: 14px 16px; display: none;
  border-radius: 12px; background: var(--panel2); border: 1px solid var(--line2); box-shadow: var(--shadow); color: var(--ink); }
.pn-pop.is-on { display: block; animation: pn-in .16s ease-out; }
.pn-pop-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.pn-pop-h b { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
.pn-help-list { display: grid; grid-template-columns: max-content 1fr; gap: 9px 16px; margin: 0 0 12px; }
.pn-help-list dt { font-size: 12.5px; font-weight: 650; color: var(--ink); white-space: nowrap; }
.pn-help-list dd { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink2); }
.pn-help-keys { display: flex; flex-wrap: wrap; gap: 7px 14px; padding: 11px 0; margin-bottom: 4px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pn-help-keys span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
.pn-pop .pn-muted { margin-top: 8px; }

/* ------------------------------------------------------------ dialog */
.pn-modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(5, 9, 14, .58);
  animation: pn-fade .14s ease-out; transition: opacity .15s; }
.pn-modal.is-out { opacity: 0; }
.pn-dialog { display: flex; gap: 14px; width: min(430px, 92vw); padding: 20px 20px 18px; border-radius: 14px;
  background: var(--panel2); border: 1px solid var(--line2); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); animation: pn-in .18s ease-out; }

.pn-dialog-a .pn-btn { min-width: 92px; height: 34px; }

<div id="app">
  <header id="topbar"></header>     <!-- panels.js -->
  <aside id="palette"></aside>      <!-- panels.js : rooms, doors, windows, section -->
  <main id="stage"></main>          <!-- canvas.js : the drawing board -->

</div>
<!-- load order matters: every module adds itself to globalThis.HP -->
<script>/* src/core.js */
"use strict";
/* ============================================================================
   House Planner - core.js
   ----------------------------------------------------------------------------
   Shared by every module: units, the plan (save-file) format, room types, the
   rules, layers and small exact geometry helpers. No DOM in here.

   UNITS: every length inside a plan is an INTEGER number of CENTIMETRES on a
   5 cm grid. Only drawing.js converts to metres (for the screen and the DXF).
   AXES:  x to the right, y UP (CAD convention). The plot's first edge (pts[0]
   -> pts[1]) is the bottom edge, which is the front by default.
   ROOMS: x, y, w, h describe the CLEAR inside of the room (inner wall faces).
   Walls are the space between rooms: a shared wall is a gap of exactly
   walls.int between two rooms; every room has walls.ext of wall round any
   side that does not touch another room.
============================================================================ */
(function (HP) {
  const VERSION = 1;
  const GRID = 5;                                   // cm

  // ------------------------------------------------------------ numbers
  const snap = v => Math.round(v / GRID) * GRID;
  const snapDown = v => Math.floor(v / GRID + 1e-9) * GRID;
  const snapUp = v => Math.ceil(v / GRID - 1e-9) * GRID;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const cm2m = v => v / 100;
  const fmtM = cm => (cm / 100).toFixed(2);          // 420 -> "4.20"
  const fmtArea = cm2 => (cm2 / 10000).toFixed(1);   // cm^2 -> "12.5"

  // ------------------------------------------------------------ room types
  /* win      allowed window widths for this room [min, max] cm (rule R2), null = no windows
     winDef   width used when a window is placed automatically
     size     default clear size [w, h] when dropped from the side panel
     hardMin  a drag can never make either side smaller than this (cm)
     roofed   false = open to the sky (counts as an open area)
     needsWindow  rule: must have at least one window onto an open area
     tint     screen-only colour hint for the type (never exported)            */
  const ROOM_TYPES = {
    bedroom:   { label: "Bedroom",     roofed: true,  needsWindow: true,  win: [100, 150], winDef: 120, size: [360, 400], hardMin: 200, tint: "#6c7bd9" },
    living:    { label: "Living room", roofed: true,  needsWindow: true,  win: [150, 250], winDef: 150, size: [450, 500], hardMin: 200, tint: "#d9a35f" },
    reception: { label: "Reception",   roofed: true,  needsWindow: true,  win: [150, 250], winDef: 150, size: [400, 450], hardMin: 200, tint: "#c06cd9" },
    kitchen:   { label: "Kitchen",     roofed: true,  needsWindow: true,  win: [150, 250], winDef: 150, size: [300, 400], hardMin: 150, tint: "#5fcf8f" },
    bath:      { label: "Bathroom",    roofed: true,  needsWindow: true,  win: [60, 60],   winDef: 60,  size: [200, 250], hardMin: 100, tint: "#5fbfd9" },
    wc:        { label: "Toilet (WC)", roofed: true,  needsWindow: true,  win: [60, 60],   winDef: 60,  size: [130, 180], hardMin: 80,  tint: "#5f93d9" },
    open:      { label: "Open area",   roofed: false, needsWindow: false, win: null,       winDef: 0,   size: [200, 300], hardMin: 100, tint: "#4f9a6c" },
    hall:      { label: "Hall",        roofed: true,  needsWindow: false, win: [60, 250],  winDef: 100, size: [160, 400], hardMin: 90,  tint: "#8a93a3" },
  };
  const ROOM_ORDER = ["bedroom", "living", "reception", "kitchen", "bath", "wc", "open", "hall"];

  const WINDOW_SIZES = [60, 100, 120, 150, 200, 250];   // cm, what the side panel offers
  const DOOR_SIZES = [80, 100];                         // cm
  const DOORS = { entrance: 100, interior: 80 };        // default widths

  // ------------------------------------------------------------ the rules
  /* From the v0.5 generator (engine.js RULES) and Rasa's brief of 2026-10-14.
     Rule ids are what analyze() reports; the text lives in analyze.js.       */
  const RULES = {
    bedroom:      { min: 300, max: 500 },             // R1: both sides 3.00-5.00 m
    openArea:     { shortMin: 130, longMin: 200 },    // R4: an open area is at least 1.30 x 2.00 m
    minOpenDepth: 100,  // unbuilt plot in front of a wall counts as open (yard) only if at least this deep
    minGap:       100,  // two outer wall faces (or a face and the boundary) closer than this leave a
                        // useless slot - edits snap such gaps shut or open to this
    endClear:     10,   // wall left between an opening and a corner
    openingGap:   10,   // wall left between two openings on one wall
    needOneOf:    ["bath", "wc", "living"],           // at least one of each must exist
  };

  // ------------------------------------------------------------ layers
  /* One table for the screen and the DXF, so they can never disagree.
     color = true colour (hex). ltype = linetype name. lw = lineweight in mm.
     Colours come from Rasa's reference DXF via the old generator.            */
  const LAYERS = {
    "A-WALL":      { color: "#a04040", ltype: "CONTINUOUS", lw: 0.35, desc: "Wall outlines" },
    "A-WALL-PATT": { color: "#8c2f2f", ltype: "CONTINUOUS", lw: 0.13, desc: "Wall hatch (ANSI31)" },
    "A-DOOR":      { color: "#e2e2ea", ltype: "CONTINUOUS", lw: 0.25, desc: "Door leaves and swings" },
    "A-GLAZ":      { color: "#2e9bd6", ltype: "CONTINUOUS", lw: 0.25, desc: "Windows" },
    "A-FURN":      { color: "#8b93a7", ltype: "CONTINUOUS", lw: 0.18, desc: "Furniture" },
    "A-FIXT":      { color: "#7fb2c2", ltype: "CONTINUOUS", lw: 0.18, desc: "Sanitary and kitchen fixtures" },
    "A-ANNO-TEXT": { color: "#9a9ae4", ltype: "CONTINUOUS", lw: 0.18, desc: "Room names and areas" },
    "A-ANNO-DIMS": { color: "#16b6c9", ltype: "CONTINUOUS", lw: 0.18, desc: "Dimensions", text: "#8fe6f0" },
    "A-SECT":      { color: "#d94b4b", ltype: "DASHDOT",    lw: 0.35, desc: "Section marks" },
    "A-PLOT":      { color: "#5a6b82", ltype: "DASHED",     lw: 0.25, desc: "Property line" },
    "A-ROAD":      { color: "#4b5567", ltype: "CONTINUOUS", lw: 0.18, desc: "Street" },
    "A-OPEN-PATT": { color: "#28455c", ltype: "CONTINUOUS", lw: 0.13, desc: "Open-area hatch (DOTS)" },
    "A-SITE-PATT": { color: "#2f8f5b", ltype: "CONTINUOUS", lw: 0.13, desc: "Yard hatch (GRASS)" },
    "A-LEVL":      { color: "#cfd6e4", ltype: "CONTINUOUS", lw: 0.18, desc: "Level marks" },
  };
  const COLORS = {                 // screen-only extras
    bg: "#0f1620", swing: "#7d7d94", dimText: "#8fe6f0",
  };

  // ------------------------------------------------------------ sides
  const SIDES = ["N", "E", "S", "W"];
  /* The edge `side` of a room's clear rectangle.
       axis  'x' for N/S (the edge runs along x), 'y' for E/W
       fixed the coordinate of the inner wall face (y for N/S, x for E/W)
       s0,s1 the edge's span along its axis (s0 < s1); an opening's `at` is
             measured from s0
       n     outward unit normal (pointing away from the room, into the wall)  */
  function sideInfo(r, side) {
    switch (side) {
      case "N": return { axis: "x", fixed: r.y + r.h, s0: r.x, s1: r.x + r.w, n: [0, 1] };
      case "S": return { axis: "x", fixed: r.y,       s0: r.x, s1: r.x + r.w, n: [0, -1] };
      case "E": return { axis: "y", fixed: r.x + r.w, s0: r.y, s1: r.y + r.h, n: [1, 0] };
      case "W": return { axis: "y", fixed: r.x,       s0: r.y, s1: r.y + r.h, n: [-1, 0] };
    }
    throw new Error("bad side " + side);
  }
  const opposite = s => ({ N: "S", S: "N", E: "W", W: "E" })[s];

  // ------------------------------------------------------------ rectangles
  const rect = (x, y, w, h) => ({ x, y, w, h });
  const grow = (r, d) => ({ x: r.x - d, y: r.y - d, w: r.w + 2 * d, h: r.h + 2 * d });
  // positive-area overlap (touching edges do NOT overlap)
  const rectsOverlap = (a, b) =>
    a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  // length of the overlap of [a0,a1] and [b0,b1] (0 if none)
  const spanOverlap = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  const containsPt = (r, p) => p[0] >= r.x && p[0] <= r.x + r.w && p[1] >= r.y && p[1] <= r.y + r.h;

  // ------------------------------------------------------------ polygons
  function polyArea(pts) {           // signed, CCW positive
    let a = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return a / 2;
  }
  // even-odd; points ON the boundary count as inside
  function pointInPoly(p, pts) {
    const [x, y] = p;
    for (let i = 0; i < pts.length; i++) {         // on an edge?
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const cr = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
      if (Math.abs(cr) < 1e-6 &&
          x >= Math.min(a[0], b[0]) - 1e-6 && x <= Math.max(a[0], b[0]) + 1e-6 &&
          y >= Math.min(a[1], b[1]) - 1e-6 && y <= Math.max(a[1], b[1]) + 1e-6) return true;
    }
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }
  // proper crossing of segments ab and cd (touching does not count)
  function segsCross(a, b, c, d) {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    const o1 = o(a, b, c), o2 = o(a, b, d), o3 = o(c, d, a), o4 = o(c, d, b);
    return o1 * o2 < 0 && o3 * o4 < 0;
  }
  // is the whole rectangle inside the polygon (boundary contact allowed)?
  function rectInPoly(r, pts) {
    const c = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
    if (!c.every(p => pointInPoly(p, pts))) return false;
    for (const v of pts)                              // a plot corner poking into the rect
      if (v[0] > r.x && v[0] < r.x + r.w && v[1] > r.y && v[1] < r.y + r.h) return false;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      for (let k = 0; k < 4; k++) if (segsCross(a, b, c[k], c[(k + 1) % 4])) return false;
    }
    return true;
  }
  const rectPlot = (w, d) => [[0, 0], [w, 0], [w, d], [0, d]];

  // ------------------------------------------------------------ plans
  function newPlan(opts) {
    const o = Object.assign({ w: 1000, d: 2000 }, opts || {});
    const now = new Date().toISOString();
    return {
      version: VERSION,
      meta: { title: "House plan", created: now, modified: now },
      plot: {
        pts: rectPlot(snap(o.w), snap(o.d)),          // CCW, edge i = pts[i] -> pts[i+1]
        edges: ["street", "neighbour", "neighbour", "neighbour"],   // bottom edge = street
        road: 800,                                    // street width drawn outside a street edge
      },
      walls: { ext: 20, int: 20 },
      rooms: [],      // { id, type, name, x, y, w, h, furn }
      openings: [],   // { id, kind:'door'|'window', room, side, at, w, hinge:'start'|'end', swing:'in'|'out' }
      sections: [],   // { id, label, a:[x,y], b:[x,y], look: 1|-1 }
      seq: 1,         // next id number
    };
  }
  const clone = s => JSON.parse(JSON.stringify(s));
  // call on a CLONE: hands out the next unique id
  function newId(s, prefix) { const id = prefix + s.seq; s.seq += 1; return id; }

  // "Bedroom 1", "Bedroom 2" ... ; the first room of a kind with no number is
  // renamed "<kind> 1" when a second one arrives (call on a CLONE)
  function nextName(s, type) {
    const base = ROOM_TYPES[type].label;
    const same = s.rooms.filter(r => r.type === type);
    if (!same.length) return base;
    same.forEach(r => { if (r.name === base) r.name = base + " 1"; });
    let n = same.length + 1;
    const taken = new Set(s.rooms.map(r => r.name));
    while (taken.has(base + " " + n)) n++;
    return base + " " + n;
  }

  // ------------------------------------------------------------ save files
  function serialize(s) {
    const out = clone(s);
    out.meta = Object.assign({}, out.meta, { modified: new Date().toISOString() });
    return JSON.stringify(out, null, 1);
  }
  // throws an Error with a plain-English message when the file is not a plan
  function deserialize(text) {
    let s;
    try { s = JSON.parse(text); } catch (e) { throw new Error("This file is not a house plan (it is not readable)."); }
    if (!s || typeof s !== "object" || !s.plot || !Array.isArray(s.rooms))
      throw new Error("This file is not a house plan.");
    if ((s.version | 0) > VERSION)
      throw new Error("This plan was saved by a newer House Planner. Please update.");
    const base = newPlan();
    s = Object.assign(base, s);
    s.openings = s.openings || []; s.sections = s.sections || [];
    s.walls = Object.assign({ ext: 20, int: 20 }, s.walls || {});
    let maxId = 0;
    [...s.rooms, ...s.openings, ...s.sections].forEach(o => {
      const n = parseInt(String(o.id).replace(/\D/g, ""), 10);
      if (n > maxId) maxId = n;
    });
    s.seq = Math.max(s.seq | 0, maxId + 1);
    s.version = VERSION;
    return s;
  }

  Object.assign(HP, {
    VERSION, GRID, snap, snapDown, snapUp, clamp, cm2m, fmtM, fmtArea,
    ROOM_TYPES, ROOM_ORDER, WINDOW_SIZES, DOOR_SIZES, DOORS, RULES, LAYERS, COLORS,
    SIDES, sideInfo, opposite,
    rect, grow, rectsOverlap, spanOverlap, containsPt,
    polyArea, pointInPoly, segsCross, rectInPoly, rectPlot,
    newPlan, clone, newId, nextName, serialize, deserialize,
  });
})(globalThis.HP = globalThis.HP || {});

if (typeof module !== "undefined" && module.exports) module.exports = globalThis.HP;

</script>
<script>/* src/store.js */
"use strict";
/* ============================================================================
   House Planner - store.js
   ----------------------------------------------------------------------------
   The one place the current plan lives, plus undo/redo, selection, a tiny
   event bus and autosave. Plans are never mutated: every edit makes a new
   plan object (HP.model ops do that) and hands it here.

   Drag pattern (canvas.js):
       const start = HP.store.get();                   // on pointerdown
       HP.store.preview(HP.model.moveRoom(start, id, x, y).state);   // each move
       HP.store.commit(HP.store.get(), "Move room");   // on pointerup
       HP.store.cancel();                              // on Esc
   preview() changes what is shown without touching the undo history; commit()
   records the last committed plan on the undo stack.

   Events (HP.store.on(name, fn) returns an unsubscribe function):
     'state'    {preview:bool, label}  the plan changed (preview or commit)
     'select'   sel                    selection changed
     'hover'    hov                    hover target changed (canvas sets it)
     'view'     {scale, ox, oy}        zoom/pan changed (canvas emits it; scale = px per metre)
     'message'  {text, level}          a toast: level 'info'|'ok'|'warn'|'error'
     'palette:start' {item, event}     a drag began on a side-panel tile
     'palette:click' {item}            a side-panel tile was clicked (no drag)
============================================================================ */
(function (HP) {
  const KEY = "houseplanner.autosave.v1";
  const MAX_UNDO = 200;
  const listeners = {};
  const S = {
    committed: null, current: null, undo: [], redo: [],
    sel: null,     // { kind: 'room'|'opening'|'section'|'plot', id }  (plot: id = corner index or null)
    hover: null,
    tool: "select", // 'select' | 'plot' (editing the land corners)
  };
  const cache = new WeakMap();
  let saveTimer = null;

  function on(evt, fn) {
    (listeners[evt] = listeners[evt] || []).push(fn);
    return () => { listeners[evt] = (listeners[evt] || []).filter(f => f !== fn); };
  }
  function emit(evt, payload) {
    (listeners[evt] || []).slice().forEach(fn => {
      try { fn(payload); } catch (e) { console.error("[store] listener for " + evt + " failed", e); }
    });
  }

  const get = () => S.current;
  const committed = () => S.committed;

  function preview(next) {
    if (!next || next === S.current) return;
    S.current = next;
    emit("state", { preview: true });
  }
  function cancel() {
    if (S.current === S.committed) return;
    S.current = S.committed;
    emit("state", { preview: false, label: "cancel" });
  }
  function commit(next, label) {
    next = next || S.current;
    if (next === S.committed) { S.current = next; return false; }
    S.undo.push({ state: S.committed, label: label || "Edit" });
    if (S.undo.length > MAX_UNDO) S.undo.shift();
    S.redo.length = 0;
    S.committed = S.current = next;
    dropStaleSelection();
    emit("state", { preview: false, label });
    autosave();
    return true;
  }
  function undo() {
    if (!S.undo.length) return false;
    const u = S.undo.pop();
    S.redo.push({ state: S.committed, label: u.label });
    S.committed = S.current = u.state;
    dropStaleSelection();
    emit("state", { preview: false, label: "Undo " + u.label });
    autosave();
    return true;
  }
  function redo() {
    if (!S.redo.length) return false;
    const r = S.redo.pop();
    S.undo.push({ state: S.committed, label: r.label });
    S.committed = S.current = r.state;
    dropStaleSelection();
    emit("state", { preview: false, label: "Redo " + r.label });
    autosave();
    return true;
  }
  const canUndo = () => S.undo.length > 0;
  const canRedo = () => S.redo.length > 0;
  const undoLabel = () => (S.undo.length ? S.undo[S.undo.length - 1].label : "");
  const redoLabel = () => (S.redo.length ? S.redo[S.redo.length - 1].label : "");

  // analysis of a plan, computed once per plan object
  function analysis(st) {
    st = st || S.current;
    let a = cache.get(st);
    if (!a) { a = HP.analyze(st); cache.set(st, a); }
    return a;
  }

  function select(sel) {
    const same = JSON.stringify(sel || null) === JSON.stringify(S.sel || null);
    S.sel = sel || null;
    if (!same) emit("select", S.sel);
  }
  const selection = () => S.sel;
  function setHover(h) {
    if (JSON.stringify(h || null) === JSON.stringify(S.hover || null)) return;
    S.hover = h || null;
    emit("hover", S.hover);
  }
  const hover = () => S.hover;
  function setTool(t) { if (S.tool !== t) { S.tool = t; emit("select", S.sel); } }
  const tool = () => S.tool;

  function dropStaleSelection() {
    const s = S.sel, st = S.committed;
    if (!s || !st) return;
    const list = s.kind === "room" ? st.rooms : s.kind === "opening" ? st.openings
               : s.kind === "section" ? st.sections : null;
    if (list && !list.some(o => o.id === s.id)) { S.sel = null; emit("select", null); }
  }

  function toast(text, level) { emit("message", { text, level: level || "info" }); }

  // replace the whole plan (open a file / new plan); undoable
  function load(st, label) { commit(st, label || "Open plan"); select(null); }

  function autosave() {
    if (typeof localStorage === "undefined") return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, HP.serialize(S.committed)); } catch (e) { /* storage off: fine */ }
    }, 400);
  }
  function restore() {
    try {
      const t = typeof localStorage !== "undefined" && localStorage.getItem(KEY);
      if (t) return HP.deserialize(t);
    } catch (e) { /* unreadable autosave: start fresh */ }
    return null;
  }

  // start with the autosaved plan if there is one, else a fresh plan
  function init(st) {
    S.committed = S.current = st || restore() || HP.newPlan();
    S.undo.length = 0; S.redo.length = 0; S.sel = null;
    emit("state", { preview: false, label: "init" });
  }

  HP.store = {
    on, emit, get, committed, preview, cancel, commit, undo, redo,
    canUndo, canRedo, undoLabel, redoLabel, analysis,
    select, selection, setHover, hover, setTool, tool, toast, load, init, KEY,
  };
})(globalThis.HP = globalThis.HP || {});

if (typeof module !== "undefined" && module.exports) module.exports = globalThis.HP;

</script>
<script>/* src/analyze.js */
"use strict";
/* ============================================================================
   House Planner - analyze.js   (model agent)
   ----------------------------------------------------------------------------
   HP.analyze(plan) -> A : everything the other modules need to know about a
   plan, worked out from scratch every time (HP.store.analysis caches it per
   plan object). Plain data only. All lengths integer cm (x right, y up).

     A.rooms        clear rooms with area, roofed flag, centre
     A.sides        what lies beyond every part of every room side
     A.walls        the wall poche with every door/window cut out (even-odd loops)
     A.footprint    outer outline of the house (union of rooms grown by walls.ext)
     A.yard         the plot minus the footprint
     A.openings     each door/window with its geometry and whether it is allowed
     A.roomOpenings per room: the openings on its walls, both faces of a shared wall
     A.handles      the wall lines a user can drag
     A.rules        the checklist, A.issues per id, A.access, A.bbox, A.stats

   HOW THE POCHE IS MADE. Every x and y where something starts or stops
   (rooms, rooms grown by walls.ext, opening cuts) cuts the plane into a grid
   of cells. A cell is wall when it is inside some grown room, inside no
   room's clear rectangle and inside no opening cut. The boundary between wall
   and non-wall cells is traced into closed loops (wall on the left, so outer
   loops run counter-clockwise and holes clockwise) and collinear points are
   dropped. Because every breakpoint is a grid line, even-odd filling of the
   loops is the poche EXACTLY - no tolerance anywhere.

   WHAT LIES BEYOND A SIDE (A.sides). Each side is sampled at the middle of
   every 5 cm step. A room exactly walls.int away across the side = shared
   wall ('room' / 'open'). Otherwise a ray goes out from the wall's OUTER face
   (inner face + walls.ext) to the first thing it meets: another room grown by
   walls.ext, or the plot boundary (any polygon, slanted edges included).
   Equal samples are merged into runs.

   Helpers for model.js are attached to the function itself:
   HP.analyze.handles(plan), HP.analyze.sidesOf(plan), HP.analyze.slots(...),
   HP.analyze.openingGeom(...), HP.analyze.ALLOW, HP.analyze.reasonFor(...).
============================================================================ */
(function (HP) {
  const SIGN = { N: 1, E: 1, S: -1, W: -1 };
  const OPP = { N: "S", S: "N", E: "W", W: "E" };
  const SIDE_NAMES = ["N", "E", "S", "W"];
  const STEP = 5;

  /* Openings allowed by what the wall faces (CONTRACT section 5). */
  const ALLOW = {
    room:      { door: true,  window: false },
    open:      { door: true,  window: true },
    yard:      { door: true,  window: true },
    street:    { door: true,  window: true },
    neighbour: { door: false, window: false },
    blocked:   { door: false, window: false },
  };

  const typeOf = r => HP.ROOM_TYPES[r.type] || null;
  const isRoofed = r => { const T = typeOf(r); return T ? T.roofed !== false : true; };
  const labelOf = r => { const T = typeOf(r); return T ? T.label : String(r.type || "Room"); };
  const word = k => (k === "door" ? "door" : "window");
  const Word = k => (k === "door" ? "Door" : "Window");
  const words = k => (k === "door" ? "Doors" : "Windows");
  const m2 = cm => HP.fmtM(cm);
  const sizeTxt = (w, h) => m2(w) + " x " + m2(h) + " m";
  function listTxt(names) {
    if (names.length <= 1) return names.join("");
    return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
  }
  function rangeTxt(win) {
    return win[0] === win[1] ? m2(win[0]) + " m" : m2(win[0]) + " to " + m2(win[1]) + " m";
  }

  /* The plain-English reason an opening may not sit on a wall facing `facing`. */
  function reasonFor(facing, kind) {
    switch (facing) {
      case "neighbour": return words(kind) + " can't go on a wall shared with the neighbours.";
      case "room":      return "Windows only go on walls that face an open area, the yard or the street.";
      case "blocked":   return "This wall is too close to another wall for a " + word(kind) + ".";
      default:          return "A " + word(kind) + " can't go here.";
    }
  }

  // ---------------------------------------------------------------- plot rays
  /* First hit of a ray with the plot boundary. The ray runs along the normal
     of a side: `along` = 'x' means the SIDE runs along x, so the ray moves in
     y at x = m, starting at o, direction sgn. Returns {t, edge} or null.
     Samples sit at x.5 and plot corners on the 5 cm grid, so a ray never
     passes through a corner; the half-open test keeps odd plots consistent. */
  function rayPlot(pts, along, m, o, sgn) {
    let best = Infinity, edge = -1;
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      let hit;
      if (along === "x") {
        if ((a[0] <= m) === (b[0] <= m)) continue;
        hit = a[1] + (m - a[0]) * (b[1] - a[1]) / (b[0] - a[0]);
      } else {
        if ((a[1] <= m) === (b[1] <= m)) continue;
        hit = a[0] + (m - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
      }
      const t = (hit - o) * sgn;
      if (t >= -1e-6 && t < best) { best = t; edge = i; }
    }
    return edge < 0 ? null : { t: Math.max(0, best), edge };
  }

  // ---------------------------------------------------------------- sides
  /* A.sides for every room. */
  function sidesOf(plan) {
    const ext = plan.walls.ext, int = plan.walls.int;
    const minOpen = HP.RULES.minOpenDepth;
    const pts = plan.plot.pts, kinds = plan.plot.edges || [];
    const rooms = plan.rooms;
    const G = rooms.map(r => ({ r, x0: r.x - ext, y0: r.y - ext, x1: r.x + r.w + ext, y1: r.y + r.h + ext,
                                roofed: isRoofed(r) }));
    const out = {};
    for (let ia = 0; ia < rooms.length; ia++) {
      const a = rooms[ia];
      const res = {};
      for (const side of SIDE_NAMES) {
        const si = HP.sideInfo(a, side), sgn = SIGN[side], along = si.axis;
        const o = si.fixed + sgn * ext;                       // outer face
        // rooms across a shared wall
        const shared = [];
        // rooms that can stand in front of the outer face
        const obst = [];
        for (let ib = 0; ib < G.length; ib++) {
          if (ib === ia) continue;
          const g = G[ib], b = g.r;
          const b0 = along === "x" ? b.x : b.y, b1 = along === "x" ? b.x + b.w : b.y + b.h;
          if (HP.spanOverlap(si.s0, si.s1, b0, b1) > 0) {
            const face = HP.sideInfo(b, OPP[side]).fixed;
            if (face === si.fixed + sgn * int) shared.push({ s0: b0, s1: b1, id: b.id, roofed: g.roofed });
          }
          const g0 = along === "x" ? g.x0 : g.y0, g1 = along === "x" ? g.x1 : g.y1;
          if (HP.spanOverlap(si.s0, si.s1, g0, g1) <= 0) continue;
          const n0 = along === "x" ? g.y0 : g.x0, n1 = along === "x" ? g.y1 : g.x1;
          if (sgn > 0 ? n1 > o : n0 < o) obst.push({ s0: g0, s1: g1, d0: sgn > 0 ? n0 - o : o - n1, id: b.id });
        }
        const runs = [];
        let cur = null;
        for (let s = si.s0; s < si.s1; s += STEP) {
          const e = Math.min(s + STEP, si.s1), m = (s + e) / 2;
          let kind = null, other = null, depth = 0;
          for (let k = 0; k < shared.length; k++) {
            const q = shared[k];
            if (q.s0 < m && m < q.s1) { kind = q.roofed ? "room" : "open"; other = q.id; break; }
          }
          if (!kind) {
            let rd = Infinity, rid = null;
            for (let k = 0; k < obst.length; k++) {
              const q = obst[k];
              if (q.s0 < m && m < q.s1) {
                const d = Math.max(0, q.d0);
                if (d < rd) { rd = d; rid = q.id; }
              }
            }
            const hit = rayPlot(pts, along, m, o, sgn);
            const pd = hit ? hit.t : Infinity;
            if (rd < pd) {
              depth = rd;
              if (rd < minOpen) { kind = "blocked"; other = rid; } else kind = "yard";
            } else if (hit) {
              depth = pd;
              if (pd < minOpen) { kind = kinds[hit.edge] === "street" ? "street" : "neighbour"; other = hit.edge; }
              else kind = "yard";
            } else {                                      // the wall stands outside the land
              kind = "neighbour"; other = null; depth = 0;
            }
          }
          if (cur && cur.kind === kind && cur.other === other) {
            cur.s1 = e; if (depth < cur.depth) cur.depth = depth;
          } else {
            cur = { s0: s, s1: e, kind, other, depth };
            runs.push(cur);
          }
        }
        runs.forEach(rn => { rn.depth = Math.round(rn.depth); });
        res[side] = runs;
      }
      out[a.id] = res;
    }
    return out;
  }

  // ---------------------------------------------------------------- openings
  const thickOf = (kind, ext, int) => (kind === "room" || kind === "open" ? int : ext);

  /* Geometry of one opening on its host. `sides` = A.sides. Returns the
     A.openings record without the pairwise (openingGap) check. */
  function openingGeom(plan, host, sides, o) {
    const ext = plan.walls.ext, int = plan.walls.int, endClear = HP.RULES.endClear;
    const si = HP.sideInfo(host, o.side), sgn = SIGN[o.side];
    const s0 = si.s0 + o.at, s1 = s0 + o.w;
    const runs = (sides[host.id] || {})[o.side] || [];
    const over = runs.filter(r => r.s1 > s0 && r.s0 < s1);
    const mid = (s0 + s1) / 2;
    const main = over.find(r => r.s0 <= mid && mid < r.s1) || over[0] || null;
    let thick = ext;
    if (over.length) thick = Math.max.apply(null, over.map(r => thickOf(r.kind, ext, int)));
    const g = {
      id: o.id, kind: o.kind, room: o.room, side: o.side, at: o.at, w: o.w,
      hinge: o.kind === "door" ? (o.hinge === "end" ? "end" : "start") : undefined,
      swing: o.kind === "door" ? (o.swing === "out" ? "out" : "in") : undefined,
      axis: si.axis, s0, s1, fixed: si.fixed, thick, far: si.fixed + sgn * thick,
      n: si.n.slice(), facing: main ? main.kind : "blocked", other: main ? main.other : null,
      ok: true, reason: "",
    };
    if (g.kind !== "door") { delete g.hinge; delete g.swing; }
    const k = o.kind;
    const inSpan = s0 >= si.s0 && s1 <= si.s1 && o.w > 0;
    if (k === "window" && !isRoofed(host)) { g.ok = false; g.reason = "Windows go in rooms, not in an open area."; }
    else if (!inSpan) { g.ok = false; g.reason = "This " + word(k) + " does not fit on its wall."; }
    else if (over.length !== 1) { g.ok = false; g.reason = "This " + word(k) + " runs past a corner or a wall joint. Move it along the wall."; }
    else if (!(ALLOW[g.facing] || {})[k]) { g.ok = false; g.reason = reasonFor(g.facing, k); }
    else if (s0 - main.s0 < endClear || main.s1 - s1 < endClear) {
      g.ok = false; g.reason = "Keep at least " + m2(endClear) + " m of wall between a " + word(k) + " and a corner.";
    }
    return g;
  }

  const band = g => (g.far < g.fixed ? [g.far, g.fixed] : [g.fixed, g.far]);

  /* Do two opening records sit on the same wall closer than RULES.openingGap? */
  function tooClose(p, q) {
    if (p.axis !== q.axis) return false;
    const bp = band(p), bq = band(q);
    if (HP.spanOverlap(bp[0], bp[1], bq[0], bq[1]) <= 0) return false;
    const gap = HP.RULES.openingGap;
    return p.s0 < q.s1 + gap && q.s0 < p.s1 + gap;
  }

  /* Where an opening of `kind` and width `w` may go on room `rid`'s `side`:
     a list of { a0, a1, facing, other, thick } ranges of `at` (inclusive, on
     the 5 cm grid). Exactly the conditions openingGeom + tooClose check, so a
     placement taken from here is always reported ok by analyze().
     A = an analysis of the plan (only A.sides and A.openings are read). */
  function slots(plan, A, rid, side, kind, w, excludeId) {
    const room = plan.rooms.find(r => r.id === rid);
    if (!room) return [];
    if (kind === "window" && !isRoofed(room)) return [];
    const ext = plan.walls.ext, int = plan.walls.int;
    const endClear = HP.RULES.endClear, gap = HP.RULES.openingGap;
    const si = HP.sideInfo(room, side), sgn = SIGN[side];
    const runs = (A.sides[rid] || {})[side] || [];
    const out = [];
    for (const run of runs) {
      if (!(ALLOW[run.kind] || {})[kind]) continue;
      const lo = run.s0 + endClear, hi = run.s1 - endClear - w;
      if (lo > hi) continue;
      const thick = thickOf(run.kind, ext, int);
      const b0 = Math.min(si.fixed, si.fixed + sgn * thick), b1 = Math.max(si.fixed, si.fixed + sgn * thick);
      let iv = [[lo, hi]];
      for (const p of A.openings) {
        if (p.id === excludeId || p.axis !== si.axis) continue;
        const bp = band(p);
        if (HP.spanOverlap(b0, b1, bp[0], bp[1]) <= 0) continue;
        const f0 = p.s0 - gap - w, f1 = p.s1 + gap;      // forbidden: f0 < s0 < f1
        const next = [];
        for (const [a, b] of iv) {
          if (b <= f0 || a >= f1) { next.push([a, b]); continue; }
          if (a <= f0) next.push([a, f0]);
          if (b >= f1) next.push([f1, b]);
        }
        iv = next;
        if (!iv.length) break;
      }
      for (const [a, b] of iv) {
        const a0 = HP.snapUp(a - si.s0), a1 = HP.snapDown(b - si.s0);
        if (a0 <= a1) out.push({ a0, a1, facing: run.kind, other: run.other, thick });
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- cells
  /* Trace the boundary of the filled cells into closed loops: filled on the
     left (outer loops CCW, holes CW), collinear points merged, first point not
     repeated. At a vertex where two filled cells touch only at a corner the
     trace turns left, so such cells give separate loops. */
  function traceCells(fill, nx, ny, xs, ys) {
    const VW = nx + 1, nV = VW * (ny + 1);
    const out0 = new Int32Array(nV).fill(-1), out1 = new Int32Array(nV).fill(-1);
    const eTo = [], eDir = [], eFrom = [];
    const add = (f, t, d) => {
      const e = eTo.length;
      eTo.push(t); eDir.push(d); eFrom.push(f);
      if (out0[f] < 0) out0[f] = e; else out1[f] = e;
    };
    const filled = (i, j) => i >= 0 && j >= 0 && i < nx && j < ny && fill[j * nx + i] === 1;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      if (fill[j * nx + i] !== 1) continue;
      if (!filled(i, j - 1)) add(j * VW + i, j * VW + i + 1, 0);                  // bottom, +x
      if (!filled(i + 1, j)) add(j * VW + i + 1, (j + 1) * VW + i + 1, 1);        // right, +y
      if (!filled(i, j + 1)) add((j + 1) * VW + i + 1, (j + 1) * VW + i, 2);      // top, -x
      if (!filled(i - 1, j)) add((j + 1) * VW + i, j * VW + i, 3);                // left, -y
    }
    const used = new Uint8Array(eTo.length);
    const loops = [];
    for (let e0 = 0; e0 < eTo.length; e0++) {
      if (used[e0]) continue;
      const chain = [];
      let e = e0, guard = eTo.length + 1;
      while (guard-- > 0) {
        used[e] = 1; chain.push(e);
        const v = eTo[e], d = eDir[e], a = out0[v], b = out1[v];
        let nxt = a;
        if (b >= 0) {
          const left = (d + 1) & 3, right = (d + 3) & 3;
          if (eDir[a] === left || eDir[b] === left) nxt = eDir[a] === left ? a : b;
          else if (eDir[a] === d || eDir[b] === d) nxt = eDir[a] === d ? a : b;
          else nxt = eDir[a] === right ? a : b;
        }
        if (nxt === e0 || nxt < 0 || used[nxt]) break;
        e = nxt;
      }
      const pts = [];
      const L = chain.length;
      for (let k = 0; k < L; k++) {
        const ek = chain[k], ep = chain[(k - 1 + L) % L];
        if (eDir[ek] !== eDir[ep]) {
          const v = eFrom[ek];
          pts.push([xs[v % VW], ys[(v / VW) | 0]]);
        }
      }
      if (pts.length >= 4) loops.push(pts);
    }
    return loops;
  }

  /* Wall poche and footprint on one breakpoint grid. */
  function poche(plan, openingGeoms) {
    const ext = plan.walls.ext;
    const rooms = plan.rooms.filter(r => r.w > 0 && r.h > 0);
    const xsSet = new Set(), ysSet = new Set();
    const grown = rooms.map(r => [r.x - ext, r.y - ext, r.x + r.w + ext, r.y + r.h + ext]);
    const clear = rooms.map(r => [r.x, r.y, r.x + r.w, r.y + r.h]);
    const cuts = openingGeoms.map(g => {
      const b = band(g);
      return g.axis === "x" ? [g.s0, b[0], g.s1, b[1]] : [b[0], g.s0, b[1], g.s1];
    }).filter(c => c[2] > c[0] && c[3] > c[1]);
    for (const list of [grown, clear, cuts]) for (const c of list) {
      xsSet.add(c[0]); xsSet.add(c[2]); ysSet.add(c[1]); ysSet.add(c[3]);
    }
    const xs = Array.from(xsSet).sort((a, b) => a - b), ys = Array.from(ysSet).sort((a, b) => a - b);
    const nx = Math.max(0, xs.length - 1), ny = Math.max(0, ys.length - 1);
    const xi = new Map(xs.map((v, i) => [v, i])), yi = new Map(ys.map((v, i) => [v, i]));
    const foot = new Uint8Array(nx * ny);
    const paint = (arr, c, val) => {
      const i0 = xi.get(c[0]), i1 = xi.get(c[2]), j0 = yi.get(c[1]), j1 = yi.get(c[3]);
      for (let j = j0; j < j1; j++) { const row = j * nx; for (let i = i0; i < i1; i++) arr[row + i] = val; }
    };
    grown.forEach(c => paint(foot, c, 1));
    const wall = foot.slice();
    clear.forEach(c => paint(wall, c, 0));
    cuts.forEach(c => paint(wall, c, 0));
    let footArea = 0;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++)
      if (foot[j * nx + i]) footArea += (xs[i + 1] - xs[i]) * (ys[j + 1] - ys[j]);
    return {
      walls: nx && ny ? traceCells(wall, nx, ny, xs, ys) : [],
      footprint: nx && ny ? traceCells(foot, nx, ny, xs, ys) : [],
      footArea,
    };
  }

  // ---------------------------------------------------------------- handles
  /* The wall lines a user can drag. Every room side goes on a line keyed by
     its "low" inner face: an E side at x = f is on line f, a W side at x is on
     line x - int (so the two faces of a shared wall land on one line); same
     for N (y = f) and S (y - int). On each line the sides are sorted along it
     and chained while they touch, overlap, or leave no more than the walls.int
     gap of a perpendicular wall between them. Each chain is one handle.     */
  function handles(plan) {
    const ext = plan.walls.ext, int = plan.walls.int;
    const lines = new Map();
    const put = (orient, f, m) => {
      const k = orient + f;
      let L = lines.get(k);
      if (!L) { L = { orient, f, list: [] }; lines.set(k, L); }
      L.list.push(m);
    };
    for (const r of plan.rooms) {
      if (!(r.w > 0 && r.h > 0)) continue;
      put("v", r.x + r.w, { room: r.id, side: "E", a0: r.y, a1: r.y + r.h, lo: true });
      put("v", r.x - int, { room: r.id, side: "W", a0: r.y, a1: r.y + r.h, lo: false });
      put("h", r.y + r.h, { room: r.id, side: "N", a0: r.x, a1: r.x + r.w, lo: true });
      put("h", r.y - int, { room: r.id, side: "S", a0: r.x, a1: r.x + r.w, lo: false });
    }
    const out = [];
    const keys = Array.from(lines.keys()).sort();
    for (const k of keys) {
      const L = lines.get(k);
      L.list.sort((p, q) => p.a0 - q.a0 || p.a1 - q.a1 || (p.room < q.room ? -1 : 1));
      let chain = null, end = -Infinity;
      const flush = () => {
        if (!chain) return;
        const los = chain.filter(m => m.lo), his = chain.filter(m => !m.lo);
        let shared = false;
        for (const p of los) for (const q of his) if (HP.spanOverlap(p.a0, p.a1, q.a0, q.a1) > 0) shared = true;
        const pos = los.length && his.length ? L.f + int / 2 : los.length ? L.f + ext / 2 : L.f + int - ext / 2;
        const from = Math.min.apply(null, chain.map(m => m.a0)), to = Math.max.apply(null, chain.map(m => m.a1));
        out.push({
          key: L.orient + L.f + ":" + from + ":" + to, orient: L.orient, pos, from, to,
          members: chain.map(m => ({ room: m.room, side: m.side })),
          kind: shared ? "shared" : "outer",
        });
      };
      for (const m of L.list) {
        if (chain && m.a0 <= end + int) { chain.push(m); end = Math.max(end, m.a1); }
        else { flush(); chain = [m]; end = m.a1; }
      }
      flush();
    }
    return out;
  }

  // ---------------------------------------------------------------- analyze
  function analyze(plan) {
    const ext = plan.walls.ext, int = plan.walls.int;
    const R = HP.RULES;
    const rooms = plan.rooms;
    const byId = new Map(rooms.map(r => [r.id, r]));
    const plotPts = plan.plot.pts;

    const A = {};
    A.rooms = rooms.map(r => ({
      id: r.id, type: r.type, name: r.name, x: r.x, y: r.y, w: r.w, h: r.h,
      area: r.w * r.h, roofed: isRoofed(r), cx: r.x + r.w / 2, cy: r.y + r.h / 2,
    }));
    A.sides = sidesOf(plan);

    // ---- openings
    const lost = [];
    const geoms = [];
    for (const o of plan.openings) {
      const host = byId.get(o.room);
      if (!host || !SIGN[o.side]) { lost.push(o.id); continue; }
      geoms.push(openingGeom(plan, host, A.sides, o));
    }
    for (let i = 0; i < geoms.length; i++) for (let j = i + 1; j < geoms.length; j++) {
      const p = geoms[i], q = geoms[j];
      if (!tooClose(p, q)) continue;
      const why = "Keep at least " + m2(R.openingGap) + " m of wall between two doors or windows.";
      if (p.ok) { p.ok = false; p.reason = why; }
      if (q.ok) { q.ok = false; q.reason = why; }
    }
    A.openings = geoms;

    // ---- per-room view of the openings
    A.roomOpenings = {};
    rooms.forEach(r => { A.roomOpenings[r.id] = []; });
    for (const g of geoms) {
      const isDoor = g.kind === "door";
      const base = { id: g.id, kind: g.kind, s0: g.s0, s1: g.s1, w: g.w,
                     hingeAt: isDoor ? (g.hinge === "end" ? "s1" : "s0") : null };
      A.roomOpenings[g.room].push(Object.assign({}, base, {
        side: g.side, fixed: g.fixed, host: true, swingInto: isDoor && g.swing === "in" }));
      if ((g.facing === "room" || g.facing === "open") && A.roomOpenings[g.other]) {
        A.roomOpenings[g.other].push(Object.assign({}, base, {
          side: OPP[g.side], fixed: g.far, host: false, swingInto: isDoor && g.swing === "out" }));
      }
    }

    // ---- poche, footprint, yard
    const P = poche(plan, geoms);
    A.walls = { loops: P.walls };
    A.footprint = { loops: P.footprint };
    const plotCCW = HP.polyArea(plotPts) >= 0;
    A.yard = { loops: [plotPts.map(p => [p[0], p[1]])].concat(
      P.footprint.map(l => (plotCCW ? l.slice().reverse() : l.slice()))) };

    // ---- handles, bbox
    A.handles = handles(plan);
    if (rooms.length) {
      A.bbox = {
        x0: Math.min.apply(null, rooms.map(r => r.x - ext)), y0: Math.min.apply(null, rooms.map(r => r.y - ext)),
        x1: Math.max.apply(null, rooms.map(r => r.x + r.w + ext)), y1: Math.max.apply(null, rooms.map(r => r.y + r.h + ext)),
      };
    } else A.bbox = null;

    // ---- access: doors make a graph; the outside is one node
    const OUT = "\u0000out";
    const adj = new Map();
    const link = (a, b) => {
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b); adj.get(b).push(a);
    };
    const entrances = [];
    for (const g of geoms) {
      if (g.kind !== "door") continue;
      if ((g.facing === "room" || g.facing === "open") && byId.has(g.other)) link(g.room, g.other);
      else if (g.facing === "yard" || g.facing === "street") { link(g.room, OUT); entrances.push(g.id); }
    }
    const seen = new Set([OUT]), queue = [OUT];
    while (queue.length) {
      const n = queue.pop();
      for (const k of adj.get(n) || []) if (!seen.has(k)) { seen.add(k); queue.push(k); }
    }
    A.access = { reachable: rooms.filter(r => seen.has(r.id)).map(r => r.id), entrances };

    // ---- rules
    const rules = [];
    const rule = (id, title, ok, detail, refs) =>
      rules.push({ id, ok, level: "error", title, detail, refs: refs || [] });
    const ofType = t => rooms.filter(r => r.type === t);
    const opens = rooms.filter(r => !isRoofed(r));

    rule("open-area", "An open area (courtyard)", opens.length > 0,
      opens.length ? (opens.length === 1 ? "There is 1 open area." : "There are " + opens.length + " open areas.")
                   : "Add an open area - a courtyard open to the sky - so the rooms get light and air.");
    {
      const OA = R.openArea;
      const bad = opens.filter(r => Math.min(r.w, r.h) < OA.shortMin || Math.max(r.w, r.h) < OA.longMin);
      rule("open-size", "Open areas at least " + m2(OA.shortMin) + " x " + m2(OA.longMin) + " m", bad.length === 0,
        bad.length ? bad.map(r => r.name + " is " + sizeTxt(r.w, r.h) + ".").join(" ") +
                     " Make " + (bad.length > 1 ? "each" : "it") + " at least " + m2(OA.shortMin) + " x " + m2(OA.longMin) + " m."
                   : (opens.length ? "Big enough." : "No open area yet."),
        bad.map(r => r.id));
    }
    for (const [id, t, title] of [["bath", "bath", "A bathroom"], ["wc", "wc", "A toilet (WC)"], ["living", "living", "A living room"]]) {
      const n = ofType(t).length;
      rule(id, title, n > 0, n ? "Done." : "Add " + title.charAt(0).toLowerCase() + title.slice(1) + ".");
    }
    {
      const lit = new Set(geoms.filter(g => g.kind === "window" && (g.facing === "open" || g.facing === "yard" || g.facing === "street"))
                               .map(g => g.room));
      const bad = rooms.filter(r => { const T = typeOf(r); return T && T.needsWindow && !lit.has(r.id); });
      rule("windows", "A window in every room", bad.length === 0,
        bad.length ? listTxt(bad.map(r => r.name)) + (bad.length > 1 ? " need" : " needs") +
                     " a window onto an open area, the yard or the street."
                   : "Every room has a window.",
        bad.map(r => r.id));
    }
    {
      const bad = [], txt = [];
      for (const g of geoms) {
        if (g.kind !== "window") continue;
        const r = byId.get(g.room), T = typeOf(r);
        if (!T || !T.win) continue;
        if (g.w < T.win[0] || g.w > T.win[1]) {
          bad.push(g.id);
          txt.push(r.name + " window is " + m2(g.w) + " m - " + T.label + " windows are " + rangeTxt(T.win) + ".");
        }
      }
      rule("window-size", "Window sizes suit the rooms", bad.length === 0, bad.length ? txt.join(" ") : "All windows fit their rooms.", bad);
    }
    {
      const B = R.bedroom;
      const bad = ofType("bedroom").filter(r => r.w < B.min || r.w > B.max || r.h < B.min || r.h > B.max);
      rule("bedroom-size", "Bedrooms " + m2(B.min) + " to " + m2(B.max) + " m each way", bad.length === 0,
        bad.length ? bad.map(r => r.name + " is " + sizeTxt(r.w, r.h) + ".").join(" ")
                   : (ofType("bedroom").length ? "Every bedroom is a good size." : "No bedrooms yet."),
        bad.map(r => r.id));
    }
    {
      const bad = geoms.filter(g => !g.ok);
      const txt = bad.map(g => byId.get(g.room).name + " " + word(g.kind) + ": " + g.reason);
      if (lost.length) txt.push(lost.length + " door(s) or window(s) belong to a room that is gone.");
      rule("openings", "Doors and windows on the right walls", bad.length === 0 && lost.length === 0,
        txt.length ? txt.join(" ") : "Every door and window is in a good place.",
        bad.map(g => g.id).concat(lost));
    }
    {
      const roofed = rooms.filter(isRoofed);
      const cut = roofed.filter(r => !seen.has(r.id));
      let ok = true, detail = "Every room can be reached through doors.";
      if (roofed.length && !entrances.length) {
        ok = false; detail = "There is no door to the outside. Put a door on a wall that faces the yard or the street.";
      } else if (cut.length) {
        ok = false; detail = listTxt(cut.map(r => r.name)) + (cut.length > 1 ? " can't" : " can't") + " be reached through doors.";
      }
      rule("access", "Every room has a way in", ok, detail, cut.map(r => r.id));
    }
    {
      const bad = [], txt = [];
      for (const r of rooms) {
        if (!HP.rectInPoly(HP.grow(r, ext), plotPts)) { bad.push(r.id); txt.push(r.name + " goes outside the land."); }
      }
      for (let i = 0; i < rooms.length; i++) for (let j = i + 1; j < rooms.length; j++) {
        if (HP.rectsOverlap(rooms[i], rooms[j])) {
          bad.push(rooms[i].id, rooms[j].id); txt.push(rooms[i].name + " overlaps " + rooms[j].name + ".");
        }
      }
      rule("fits", "Everything inside the land", bad.length === 0, bad.length ? txt.join(" ") : "Everything is inside the land.",

<script>/* src/model.js */
"use strict";
/* ============================================================================
   House Planner - model.js   (model agent)
   ----------------------------------------------------------------------------
   Every edit of a plan. All ops are PURE: they never change the plan they are
   given; they return { state, ok, reason, id, note } where `state` is a new
   plan (or the very same object when nothing changed). See CONTRACT.md s.6.

   ONE LEGALITY RULE for rooms, used by every op (codes: 0 fine, 1 a gap that
   must snap shut or open, 2 impossible):
     - x, y, w, h integers on the 5 cm grid; each side >= the type's hardMin
     - the room grown by walls.ext lies inside the land
     - two rooms never overlap; where their clear rectangles face each other
       the gap is exactly walls.int (a shared wall) or at least
       2*walls.ext + RULES.minGap (a real passage). Rooms that only meet
       corner to corner must either be that far apart on one axis or touch
       as a clean wall joint (walls.int on both axes).
     - a room's outer wall face and an axis-aligned land edge are 0 apart or
       at least RULES.minGap apart.

   past them to the nearest allowed value. Code 2 ("hard") stops a drag.

(function (HP) {
  const R = HP.RULES;

  const SIGN = { N: 1, E: 1, S: -1, W: -1 };
  const OPP = { N: "S", S: "N", E: "W", W: "E" };

  const isRoofed = r => { const T = typeOf(r); return T ? T.roofed !== false : true; };

  const findOpening = (s, id) => s.openings.find(o => o.id === id) || null;
  const findSection = (s, id) => s.sections.find(o => o.id === id) || null;
  const sideLen = (r, side) => (side === "N" || side === "S" ? r.w : r.h);
  const onGrid = v => Number.isInteger(v) && v % HP.GRID === 0;
  const word = k => (k === "door" ? "door" : "window");
  const A_NAME = { bedroom: "a bedroom", living: "a living room", reception: "a reception room", kitchen: "a kitchen",
                   bath: "a bathroom", wc: "a toilet", open: "an open area", hall: "a hall" };

  function res(state, ok, reason, id, note) {
    return { state, ok: !!ok, reason: reason || "", id: id || null, note: note || "" };
  }

  const fail = (state, reason) => res(state, false, reason);
  const joinNotes = notes => Array.from(new Set(notes.filter(Boolean))).join(" ");

  // ================================================================ legality
  function plotInfo(plan) {
    const pts = plan.plot.pts;

    const P = { pts, x0: Math.min.apply(null, xs), y0: Math.min.apply(null, ys),
                x1: Math.max.apply(null, xs), y1: Math.max.apply(null, ys), vEdges: [], hEdges: [], rect: false };
    for (let i = 0; i < pts.length; i++) {

    }

    return r.w < T.hardMin || r.h < T.hardMin ? 2 : 0;

  function rawPair(a, b, W) {

    const rs = [];

      if (!r || r.id === skipA || r.id === skipB) return;
      const g = [r.x - e, r.y - e, r.x + r.w + e, r.y + r.h + e];
      if (g[0] >= box[2] || g[2] <= box[0] || g[1] >= box[3] || g[3] <= box[1]) return;

    if (!rs.length) return false;
    for (const g of rs) if (g[0] <= box[0] && g[1] <= box[1] && g[2] >= box[2] && g[3] >= box[3]) return true;
    const cut = (lo, hi, k0, k1) => Array.from(new Set([lo, hi].concat(rs.map(g => g[k0]), rs.map(g => g[k1]))
      .filter(v => v >= lo && v <= hi))).sort((p, q) => p - q);

  function pairCode(a, b, W, rooms, extra) {

     wall and an axis-aligned land edge (unless other rooms fill that slot),
     0 fine. rooms = null asks only about r itself. */
  function plotCode(r, P, W, rooms, extra) {

    } else if (gx0 < P.x0 || gy0 < P.y0 || gx1 > P.x1 || gy1 > P.y1 ||
               !HP.rectInPoly({ x: gx0, y: gy0, w: gx1 - gx0, h: gy1 - gy0 }, P.pts)) return 2;

    const slot = box => !rooms || !covered(box, rooms, W.ext, r.id, null, extra);

    for (let k = 0; k < others.length; k++) {
      const c = pairCode(t, others[k], W, others);
      if (c === 2) return 2;
      if (c > worst) worst = c;

    if (!onGrid(W.ext) || !onGrid(W.int) || W.ext <= 0 || W.int <= 0) say("Wall thickness must be on the 5 cm grid.");
    if (W.int > 2 * W.ext) say("Inside walls can't be more than twice as thick as outside walls.");
    for (const r of rooms) {
      const T = typeOf(r);

      else if (!onGrid(r.x) || !onGrid(r.y) || !onGrid(r.w) || !onGrid(r.h)) say(r.name + " is not on the 5 cm grid.", [r.id]);
      else if (r.w < T.hardMin || r.h < T.hardMin) say(r.name + " is smaller than " + m2(T.hardMin) + " m.", [r.id]);

      else if (c === 1) say(rooms[i].name + " and " + rooms[j].name + " are too close: share a wall or leave " +

  function fitWindowWidth(w, type) {

    if (!T || !T.win || T.roofed === false) return null;
    if (w >= T.win[0] && w <= T.win[1]) return w;
    const ok = HP.WINDOW_SIZES.filter(v => v >= T.win[0] && v <= T.win[1]);
    if (!ok.length) return HP.clamp(w, T.win[0], T.win[1]);

  }
  function widthNote(type, w) {
    const T = HP.ROOM_TYPES[type];
    return T.label + " windows are " + rangeTxt(T.win) + " - set to " + m2(w) + ".";
  }

  /* Keep the openings of one room on their walls. When a wall got too short
     for what is on it, windows step down to a smaller size (one the room type
     allows if there is one, else any size from HP.WINDOW_SIZES - the rules
     panel then says so) and a 1.00 door becomes 0.80; only what still can't
     fit is taken out. Then every opening keeps RULES.endClear from the
     corners and RULES.openingGap from its neighbours on that side. */
  function settleRoom(s, id, notes) {
    const r = findRoom(s, id);
    if (!r) return;
    const EC = R.endClear, GAP = R.openingGap, T = typeOf(r);
    const smaller = o => {                       // the next size down, or null
      if (o.kind !== "window") return o.w > HP.DOORS.interior ? HP.DOORS.interior : null;
      const inRange = T && T.win ? HP.WINDOW_SIZES.filter(v => v >= T.win[0] && v <= T.win[1] && v < o.w) : [];
      const pool = inRange.length ? inRange : HP.WINDOW_SIZES.filter(v => v < o.w);
      return pool.length ? pool[pool.length - 1] : null;
    };
    for (const side of SIDES) {
      let list = s.openings.filter(o => o.room === id && o.side === side);
      if (!list.length) continue;
      const L = sideLen(r, side);
      const need = () => list.reduce((t, o) => t + o.w, 0) + GAP * (list.length - 1) + 2 * EC;
      const shrink = o => {
        o.w = smaller(o);
        notes.push(o.kind === "window" ? "A window was made smaller to fit its wall." : "A door was made " + m2(o.w) + " m to fit its wall.");
      };
      for (const o of list) while (o.w + 2 * EC > L && smaller(o) != null) shrink(o);
      while (need() > L) {
        const c = list.filter(o => smaller(o) != null).sort((a, b) => b.w - a.w)[0];
        if (!c) break;
        shrink(c);
      }
      const drop = o => {
        s.openings.splice(s.openings.indexOf(o), 1);
        notes.push("A " + word(o.kind) + " no longer fitted on its wall and was taken out.");
      };
      list.filter(o => o.w + 2 * EC > L).forEach(drop);
      list = list.filter(o => o.w + 2 * EC <= L).sort((a, b) => a.at - b.at || a.w - b.w);
      while (list.length && need() > L) drop(list.pop());
      let pos = EC;
      for (const o of list) { if (o.at < pos) o.at = pos; pos = o.at + o.w + GAP; }
      let lim = L - EC;
      for (let k = list.length - 1; k >= 0; k--) {

  function fixWindows(s, ids, notes) {

        });

  /* After an edit: every door or window that was allowed before and is not
     now moves to the nearest legal place in its own room. Windows first (they
     have fewer walls to go to), then doors, each in plan order. A window tries
     its own wall first, then open area > yard > street; a door first keeps the
     same connection (same room / the outside), then its own wall, then the same
     order. It keeps its width or steps down within what the room type allows.

  const SIDE_WORD = { N: "north", E: "east", S: "south", W: "west" };
  const FACE_RANK = { open: 0, yard: 1, street: 2, room: 3 };
  function rescueOpenings(before, s, notes) {
    if (!s.openings.length || !before.openings.length) return;
    const A0 = HP.analyze(before);
    const was = new Map(A0.openings.filter(g => g.ok).map(g => [g.id, g]));
    if (!was.size) return;
    const A = HP.analyze(s);
    const broken = A.openings.filter(g => !g.ok && was.has(g.id));
    if (!broken.length) return;
    broken.sort((p, q) => (p.kind === q.kind ? 0 : p.kind === "window" ? -1 : 1));
