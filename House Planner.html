        else if (o.side === "W") b = { x0: r.x, y0: o.s0, x1: r.x + w, y1: o.s1 };
        else b = { x0: r.x + r.w - w, y0: o.s0, x1: r.x + r.w, y1: o.s1 };
        bx.push({ x0: M(b.x0), y0: M(b.y0), x1: M(b.x1), y1: M(b.y1) });
      }
      swingBoxes[r.id] = bx;
    }
    const sectBoxes = [];                                  // a band round every section line
    if (opts.sections)
      for (const s of plan.sections || []) {
        const e = 0.08;
        sectBoxes.push({ x0: M(Math.min(s.a[0], s.b[0])) - e, y0: M(Math.min(s.a[1], s.b[1])) - e,
          x1: M(Math.max(s.a[0], s.b[0])) + e, y1: M(Math.max(s.a[1], s.b[1])) + e });
      }
    for (const r of rooms) {
      const x0 = M(r.x), y0 = M(r.y), x1 = M(r.x + r.w), y1 = M(r.y + r.h);
      const open = r.roofed === false || r.type === "open";
      let holes = [];
      if (opts.labels) {
        const subs = [];
        if (!open) subs.push({ text: HP.fmtArea(r.area != null ? r.area : r.w * r.h) + " m\u00b2", h: SIZES.area, role: "room-area" });
        if (opts.sizes) subs.push({ text: HP.fmtM(r.w) + " x " + HP.fmtM(r.h), h: SIZES.size, role: "room-size" });
        const pad = SIZES.labelPad;
        const W = Math.max(0.2, x1 - x0 - 2 * pad), H = Math.max(0.2, y1 - y0 - 2 * pad);
        const name = String(r.name || "").toUpperCase();
        /* the spot nearest the middle that is clear of furniture, door swings
           and section lines; if the whole label finds none, the size line goes,
           then the area line, and the name alone takes the least crowded spot */
        const roomBox = { x0, y0, x1, y1 };
        const hard = (furnBoxes[r.id] || []).concat(swingBoxes[r.id] || []);   // may cost the small lines
        const soft = sectBoxes.filter(b => boxOverlap(b, roomBox));            // only moves the label
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        let lab = fitLabel(name, subs, W, H), cx = mx, cy = my;
        if (hard.length || soft.length) {
          const over = (list, b) => {
            let t = 0;
            for (const o of list) if (boxOverlap(o, b))
              t += (Math.min(o.x1, b.x1) - Math.max(o.x0, b.x0)) * (Math.min(o.y1, b.y1) - Math.max(o.y0, b.y0));
            return t;
          };
          // smaller first, fewer lines last: the area under the name is the drafting style
          const noSize = subs.filter(s => s.role !== "room-size");
          const variants = [[subs, 1], [subs, 0.8], [subs, 0.65], [noSize, 0.65], [[], 0.65]];
          let placed = false, last = null;
          for (let vi = 0; vi < variants.length && !placed; vi++) {
            const [vs, vk] = variants[vi];
            if (vi > 0 && vs.length === variants[vi - 1][0].length && vk === variants[vi - 1][1]) continue;
            const L = vi === 0 ? lab : fitLabel(name, vs, W, H, vk);
            const hw = L.w / 2 + 0.05, hh = L.h / 2 + 0.05;
            const rx = Math.max(0, (x1 - x0) / 2 - pad - hw), ry = Math.max(0, (y1 - y0) / 2 - pad - hh);
            const cands = [[mx, my, 0]];
            const n = 5;
            for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
              if (!i && !j) continue;
              const px = mx + rx * i / n, py = my + ry * j / n;
              cands.push([px, py, (px - mx) ** 2 + (py - my) ** 2]);
            }
            cands.sort((a, b) => a[2] - b[2] || a[1] - b[1] || a[0] - b[0]);
            // nearest the middle among the spots clear of furniture, least on a section line
            let best = null, bh = Infinity, bs = Infinity;
            for (const c of cands) {
              const b = { x0: c[0] - hw, y0: c[1] - hh, x1: c[0] + hw, y1: c[1] + hh };
              const kh = over(hard, b), ks = over(soft, b);
              if (kh < bh - 1e-9 || (Math.abs(kh - bh) <= 1e-9 && ks < bs - 1e-9)) { best = c; bh = kh; bs = ks; }
              if (bh === 0 && bs === 0) break;
            }
            last = { L, best };
            if (bh === 0) { lab = L; cx = best[0]; cy = best[1]; placed = true; }
          }
          if (!placed && last) { lab = last.L; cx = last.best[0]; cy = last.best[1]; }
        }
        for (const l of placeLines(lab, cx, cy))
          G.text.push(item("text", "A-ANNO-TEXT", l.role, r.id, { p: l.p, h: l.h, text: l.text, align: "mc", rot: 0, w: l.w }));
        const m = SIZES.yardMinHole + 0.04;
        const hb = { x0: cx - lab.w / 2 - m, y0: cy - lab.h / 2 - m, x1: cx + lab.w / 2 + m, y1: cy + lab.h / 2 + m };
        if (hb.x0 > x0 && hb.x1 < x1 && hb.y0 > y0 && hb.y1 < y1) holes = [rectLoop(hb.x0, hb.y0, hb.x1, hb.y1)];
      }
      if (open)
        G.open.push(item("hatch", "A-OPEN-PATT", "open-hatch", r.id,
          { pattern: HATCH.open.pattern, scale: HATCH.open.scale, angle: HATCH.open.angle, loops: [rectLoop(x0, y0, x1, y1)].concat(holes) }));
    }

    // ---------------------------------------------------------- dimensions
    const bb = A.bbox || null;
    const plotBox = plotPts.length ? {
      x0: Math.min(...plotPts.map(p => p[0])), y0: Math.min(...plotPts.map(p => p[1])),
      x1: Math.max(...plotPts.map(p => p[0])), y1: Math.max(...plotPts.map(p => p[1])),
    } : null;
    const rectPlotAxis = plotPts.length === 4 && plotPts.every((p, i) => {
      const q = plotPts[(i + 1) % 4]; return p[0] === q[0] || p[1] === q[1];
    });
    const lanesOut = { S: false, N: false, W: false, E: false };   // chains outside the land on that side
    const reach = { S: 0, N: 0, W: 0, E: 0 };                       // how far dims stand out past the land (m)
    if (opts.dims && bb && rooms.length) {
      for (const side of ["S", "N", "W", "E"]) {
        const pr = sideProfile(rooms, ext, int, side, bb);
        const alongX = pr.alongX, front = pr.front;
        const face = side === "S" ? bb.y0 : side === "N" ? bb.y1 : side === "W" ? bb.x0 : bb.x1;
        const pface = !plotBox ? face : side === "S" ? plotBox.y0 : side === "N" ? plotBox.y1 : side === "W" ? plotBox.x0 : plotBox.x1;
        const depth = plotPts.length >= 3 ? yardDepth(plotPts, side, bb) : Infinity;
        const inside = depth >= SIZES.laneNeed * 100;
        lanesOut[side] = !inside;
        const base = inside ? face : (front < 0 ? Math.min(face, pface) : Math.max(face, pface));
        const lane = k => M(base) + front * (SIZES.lane0 + k * SIZES.laneStep);
        if (!inside) reach[side] = Math.max(reach[side], SIZES.lane0 + SIZES.laneStep + DIM.gap + DIM.text);
        const P = alongX ? (p, q) => [p, q] : (p, q) => [q, p];
        const rot = alongX ? 0 : 90;
        const v = alongX ? [0, 1] : [-1, 0];                          // the side the text stands on
        // chain 1: walls and rooms seen from this side
        const segs = pr.segs;
        const faceAt = i => {                                          // q of the tick between seg i-1 and i
          const fs = [segs[i - 1], segs[i]].filter(s => s && s.face != null).map(s => s.face);
          return fs.length ? (front < 0 ? Math.min(...fs) : Math.max(...fs)) : face;
        };
        const chain1 = [];
        segs.forEach((s, i) => {
          const qa = faceAt(i), qb = faceAt(i + 1);
          chain1.push({ a: P(M(s.a), M(qa)), b: P(M(s.b), M(qb)), len: s.b - s.a, small: s.kind === "wall", ref: s.ref });
        });
        // chain 2: the overall length, with the distances to the land where the land is a plain rectangle
        const p0 = alongX ? bb.x0 : bb.y0, p1 = alongX ? bb.x1 : bb.y1;
        const chain2 = [{ a: P(M(p0), M(faceAt(0))), b: P(M(p1), M(faceAt(segs.length))), len: p1 - p0, small: false, ref: null }];
        if (rectPlotAxis && plotBox) {
          const P0 = alongX ? plotBox.x0 : plotBox.y0, P1 = alongX ? plotBox.x1 : plotBox.y1;
          if (p0 > P0) chain2.unshift({ a: P(M(P0), M(face)), b: P(M(p0), M(faceAt(0))), len: p0 - P0, small: false, ref: null });
          if (P1 > p1) chain2.push({ a: P(M(p1), M(faceAt(segs.length))), b: P(M(P1), M(face)), len: P1 - p1, small: false, ref: null });
        }
        [chain1, chain2].forEach((chain, k) => {
          const q = lane(k);
          let prevEnd = -Infinity, prevFlip = false;
          for (const c of chain) {
            const dm = item("dim", "A-ANNO-DIMS", "dim", c.ref, {
              a: c.a, b: c.b, d: P(alongX ? c.a[0] : c.a[1], q), rot, text: HP.fmtM(c.len), small: c.small,
              h: c.small ? DIM.small : DIM.text, chain: side + (k + 1),
            });
            // text boxes along the chain must not run into each other: flip to the other side
            const m0 = alongX ? Math.min(c.a[0], c.b[0]) : Math.min(c.a[1], c.b[1]);
            const m1 = alongX ? Math.max(c.a[0], c.b[0]) : Math.max(c.a[1], c.b[1]);
            const mid = (m0 + m1) / 2, tw = textWidth(dm.text, dm.h);
            let flip = false;
            if (mid - tw / 2 < prevEnd + 0.03 && !prevFlip) {
              flip = true;
              const off = DIM.gap + dm.h / 2;                         // the other side of the line
              dm.tp = alongX ? [mid, q - v[1] * off] : [q - v[0] * off, mid];
            }
            prevEnd = mid + tw / 2; prevFlip = flip;
            G.dims.push(dm);
          }
        });
      }
    }

    // ---------------------------------------------------------- land, street, plot dims
    if (opts.site && plotPts.length >= 3) {
      const pm = plotPts.map(p => [M(p[0]), M(p[1])]);
      G.site.push(item("pline", "A-PLOT", "plot", null, { pts: pm, closed: true }));
      const yl = loopsM(A.yard && A.yard.loops);
      const n = pm.length;
      const edges = (plan.plot.edges || []);
      const R = M(plan.plot.road || 0);
      // plot edge dimensions first: the street label must keep clear of them
      const edgeDimReach = [];
      for (let i = 0; i < n; i++) {
        const p = pm[i], q = pm[(i + 1) % n];
        const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);
        edgeDimReach[i] = 0;
        if (L < 1e-9) continue;
        const nrm = [dy / L, -dx / L];                                    // outward (pts are CCW)
        const side = Math.abs(nrm[0]) > Math.abs(nrm[1]) ? (nrm[0] > 0 ? "E" : "W") : (nrm[1] > 0 ? "N" : "S");
        // past the house's chains only when it is a straight edge on the land's outer face on that side
        const P0 = plotPts[i], Q0 = plotPts[(i + 1) % n];                // cm, like plotBox
        const onFace = plotBox && (side === "S" ? P0[1] === plotBox.y0 && Q0[1] === plotBox.y0 : side === "N" ? P0[1] === plotBox.y1 && Q0[1] === plotBox.y1
          : side === "W" ? P0[0] === plotBox.x0 && Q0[0] === plotBox.x0 : P0[0] === plotBox.x1 && Q0[0] === plotBox.x1);
        const off = SIZES.lane0 + (lanesOut[side] && onFace ? 2 * SIZES.laneStep : 0);
        if (!opts.dims) continue;
        // the house's overall chain already says the same thing on the same line: skip it
        if (lanesOut[side] && bb && rooms.length && (dx === 0 || dy === 0)) {
          const along = dy === 0;
          const lo = along ? Math.min(p[0], q[0]) : Math.min(p[1], q[1]), hi = along ? Math.max(p[0], q[0]) : Math.max(p[1], q[1]);
          const hlo = M(along ? bb.x0 : bb.y0), hhi = M(along ? bb.x1 : bb.y1);
          if (Math.abs(lo - hlo) < 1e-9 && Math.abs(hi - hhi) < 1e-9) { edgeDimReach[i] = reach[side]; continue; }
        }
        const rot = readable(Math.atan2(dy, dx) / DEG);
        const mid = [(p[0] + q[0]) / 2 + nrm[0] * off, (p[1] + q[1]) / 2 + nrm[1] * off];
        const lenCm = Math.round(Math.hypot(plotPts[(i + 1) % n][0] - plotPts[i][0], plotPts[(i + 1) % n][1] - plotPts[i][1]));
        G.dims.push(item("dim", "A-ANNO-DIMS", "plot-dim", null, {
          a: p, b: q, d: mid, rot, text: HP.fmtM(lenCm), small: false, h: DIM.text, chain: "plot" + i,
        }));
        edgeDimReach[i] = off + DIM.gap + DIM.text;
      }
      // the street: a road band outside every street edge
      for (let i = 0; i < n; i++) {
        if (edges[i] !== "street" || R <= 0) continue;
        const p = pm[i], q = pm[(i + 1) % n];
        const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);
        if (L < 1e-9) continue;
        const u = [dx / L, dy / L], nrm = [u[1], -u[0]];
        const run = SIZES.roadRun;
        const at = (s, off) => [p[0] + u[0] * s + nrm[0] * off, p[1] + u[1] * s + nrm[1] * off];
        // the pavement is widened so no kerb line runs between dimension lanes standing on the street
        let walk = Math.min(SIZES.roadWalk, R / 4);
        if (edgeDimReach[i] && edgeDimReach[i] + 0.25 > walk && edgeDimReach[i] + 0.25 < R / 2 - SIZES.roadText) walk = edgeDimReach[i] + 0.25;
        for (const off of [walk, R - walk, R])
          G.site.push(item("line", "A-ROAD", "road", "edge" + i, { a: at(-run, off), b: at(L + run, off) }));
        // the label sits on the centre line unless the dimensions reach that far
        const th = SIZES.roadText, tw = textWidth("STREET", th);
        const need = (edgeDimReach[i] || 0) + 0.3 + th / 2;
        const off = Math.max(R / 2, need);
        const rot = readable(Math.atan2(dy, dx) / DEG);
        const lp = at(L / 2, off);
        if (off === R / 2) {
          const g = tw / 2 + 0.3;
          G.site.push(item("line", "A-ROAD", "road", "edge" + i, { a: at(-run, R / 2), b: at(L / 2 - g, R / 2), ltype: "DASHED" }));
          G.site.push(item("line", "A-ROAD", "road", "edge" + i, { a: at(L / 2 + g, R / 2), b: at(L + run, R / 2), ltype: "DASHED" }));
        } else {
          G.site.push(item("line", "A-ROAD", "road", "edge" + i, { a: at(-run, R / 2), b: at(L + run, R / 2), ltype: "DASHED" }));
        }
        G.text.push(item("text", "A-ROAD", "road-label", "edge" + i, { p: lp, h: th, text: "STREET", align: "mc", rot, w: tw }));
      }
      // the yard: grass, with the dimension texts that stand on it cut out
      if (yl.length) {
        const holes = [];
        const fp = loopsM(A.footprint && A.footprint.loops);
        const okBox = b => {
          const cs = [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]];
          if (!cs.every(c => inRegion(c, yl))) return false;
          for (const l of yl.concat(fp)) for (const v of l) if (v[0] > b.x0 && v[0] < b.x1 && v[1] > b.y0 && v[1] < b.y1) return false;
          return !holes.some(h => boxOverlap(h, b));
        };
        for (const dm of G.dims) {
          const g = dimGeometry(dm);
          const tw = textWidth(dm.text, g.text.h) / 2 + SIZES.yardMinHole, thh = g.text.h / 2 + SIZES.yardMinHole;
          const vert = Math.abs(Math.abs(readable(dm.rot)) - 90) < 1e-6;
          if (!vert && Math.abs(readable(dm.rot)) > 1e-6) continue;
          const [px, py] = g.text.p;
          const b = vert ? { x0: px - thh, y0: py - tw, x1: px + thh, y1: py + tw } : { x0: px - tw, y0: py - thh, x1: px + tw, y1: py + thh };
          if (okBox(b)) holes.push(b);
        }
        G.yard.push(item("hatch", "A-SITE-PATT", "yard-hatch", null, {
          pattern: HATCH.yard.pattern, scale: HATCH.yard.scale, angle: HATCH.yard.angle,
          loops: yl.concat(holes.map(b => rectLoop(b.x0, b.y0, b.x1, b.y1))),
        }));
      }
    }

    // ---------------------------------------------------------- sections
    if (opts.sections) {
      for (const s of plan.sections || []) {
        const a = [M(s.a[0]), M(s.a[1])], b = [M(s.b[0]), M(s.b[1])];
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
        if (L < 1e-9) continue;
        const U = [dx / L, dy / L];
        const look = s.look === -1 ? -1 : 1;
        const Lk = [-U[1] * look, U[0] * look];                     // +1 looks to the left of a->b
        const hv = Math.min(SIZES.sectHeavy, L / 4);
        const r = SIZES.sectR;
        const label = String(s.label == null ? "" : s.label).toUpperCase();
        G.sect.push(item("line", "A-SECT", "section", s.id, { a, b, lw: 0.18 }));
        for (const [end, out] of [[a, [-U[0], -U[1]]], [b, U]]) {
          const inner = [end[0] - out[0] * hv, end[1] - out[1] * hv];
          G.sect.push(item("pline", "A-SECT", "section", s.id, { pts: [inner, end], closed: false, width: SIZES.sectWidth, lw: 0.7, ltype: "CONTINUOUS" }));
          const c = [end[0] + out[0] * r, end[1] + out[1] * r];
          G.sect.push(item("circle", "A-SECT", "section", s.id, { c, r, ltype: "CONTINUOUS", lw: 0.35 }));
          // the arrow: a solid point whose sides touch the circle, aimed the way the section looks
          const ap = [c[0] + Lk[0] * 2 * r, c[1] + Lk[1] * 2 * r];
          const k = Math.cos(60 * DEG) * r, w = Math.sin(60 * DEG) * r;
          const t1 = [c[0] + Lk[0] * k + out[0] * w, c[1] + Lk[1] * k + out[1] * w];
          const t2 = [c[0] + Lk[0] * k - out[0] * w, c[1] + Lk[1] * k - out[1] * w];
          G.sect.push(item("hatch", "A-SECT", "section", s.id, { pattern: "SOLID", scale: 1, angle: 0, loops: [[ap, t1, t2]] }));
          if (label) G.sect.push(item("text", "A-SECT", "section-label", s.id, { p: c, h: SIZES.sectText, text: label, align: "mc", rot: 0, w: textWidth(label, SIZES.sectText) }));
        }
      }
    }

    items.push(...G.yard, ...G.open, ...G.wallHatch, ...G.site, ...G.walls, ...G.glaz, ...G.doors,
      ...G.furn, ...G.text, ...G.dims, ...G.sect);
    return { items, blocks, extents: extentsOf(items, blocks) };
  }

  // ---------------------------------------------------------------- blocks
  const blockCache = typeof WeakMap !== "undefined" ? new WeakMap() : null;
  function blockToMetres(B) {
    if (blockCache && blockCache.has(B)) return blockCache.get(B);
    const P = p => [M(p[0]), M(p[1])];
    const conv = it => {
      const o = Object.assign({}, it);
      if (it.pts) o.pts = it.pts.map(P);
      if (it.a) o.a = P(it.a);
      if (it.b) o.b = P(it.b);
      if (it.c) o.c = P(it.c);
      if (it.p) o.p = P(it.p);
      if (it.r != null) o.r = M(it.r);
      if (it.h != null && it.kind === "text") o.h = M(it.h);
      if (it.loops) o.loops = it.loops.map(l => l.map(P));
      if (it.kind === "hatch" && it.scale != null && String(it.pattern).toUpperCase() !== "SOLID") o.scale = it.scale / 100;
      if (it.width != null) o.width = M(it.width);
      return o;
    };
    const out = { layer: B.layer || "A-FURN", w: M(B.w || 0), h: M(B.h || 0), items: (B.items || []).map(conv) };
    if (blockCache) blockCache.set(B, out);
    return out;
  }

  // ---------------------------------------------------------------- extents
  function extentsOf(items, blocks) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const add = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
    const bboxCache = {};
    const blockBox = name => {
      if (bboxCache[name]) return bboxCache[name];
      const b = blocks[name];
      const e = b ? extentsOf(b.items, {}) : null;
      return (bboxCache[name] = e);
    };
    for (const it of items) {
      switch (it.kind) {
        case "pline": for (const p of it.pts) add(p[0], p[1]); break;
        case "line": add(it.a[0], it.a[1]); add(it.b[0], it.b[1]); break;
        case "circle": case "arc": add(it.c[0] - it.r, it.c[1] - it.r); add(it.c[0] + it.r, it.c[1] + it.r); break;
        case "hatch": for (const l of it.loops) for (const p of l) add(p[0], p[1]); break;
        case "text": {
          const w = (it.w != null ? it.w : textWidth(it.text, it.h)) / 2 + it.h, hh = it.h;
          const r = Math.max(w, hh);
          add(it.p[0] - r, it.p[1] - r); add(it.p[0] + r, it.p[1] + r); break;
        }
        case "dim": {
          const g = dimGeometry(it);
          for (const l of g.lines) { add(l[0][0], l[0][1]); add(l[1][0], l[1][1]); }
          const r = textWidth(it.text, g.text.h) / 2;
          add(g.text.p[0] - r, g.text.p[1] - r); add(g.text.p[0] + r, g.text.p[1] + r);
          break;
        }
        case "insert": {
          const e = blockBox(it.block);
          if (!e) { add(it.p[0], it.p[1]); break; }

      } else {
        if (!e.stroke) e.stroke = new Path2D();
        addGeom(e.stroke, it);
      }
    }
    byLayer.set(key, g);
    return g;
  }

  // ------------------------------------------------------------------ compile a drawing
  const compiled = new WeakMap();
  function compile(drawing) {
    let c = compiled.get(drawing);
    if (c) return c;
    c = { batches: [], dims: [], texts: [], byRef: new Map(), refPaths: new Map(), drawing, count: 0 };
    let run = null;
    const runFor = () => {
      if (!run) { run = { k: "run", groups: new Map() }; c.batches.push(run); }
      return run;
    };
    const group = (st) => {
      const r = runFor(), k = styleKey(st);
      let g = r.groups.get(k);
      if (!g) { g = { st, stroke: null, fill: null, fillAlpha: 1 }; r.groups.set(k, g); }
      return g;
    };
    const blocks = drawing.blocks || {};
    for (const it of drawing.items || []) {
      c.count++;
      if (it.ref != null) {
        let l = c.byRef.get(it.ref);
        if (!l) { l = []; c.byRef.set(it.ref, l); }
        l.push(it);
      }
      switch (it.kind) {
        case "line": case "pline": case "arc": case "circle": {
          const g = group(styleOf(it));
          if (!g.stroke) g.stroke = new Path2D();
          addGeom(g.stroke, it);
          break;
        }
        case "insert": {
          const b = blocks[it.block];
          if (!b) break;
          const m = matrixOf(it);
          for (const e of compileBlock(b, it.layer).values()) {
            const g = group(e.st);
            if (e.stroke) { if (!g.stroke) g.stroke = new Path2D(); g.stroke.addPath(e.stroke, m); }
            if (e.fill) { if (!g.fill) g.fill = new Path2D(); g.fill.addPath(e.fill, m); g.fillAlpha = Math.min(g.fillAlpha, e.fillAlpha); }
          }
          break;
        }
        case "hatch": {
          const pat = String(it.pattern || "SOLID").toUpperCase();
          const lp = loopsPath(it.loops);
          if (pat === "SOLID") {           // a solid fill joins the current run (drawn under its strokes)
            const g = group(styleOf(it));
            if (!g.fill) g.fill = new Path2D();
            g.fill.addPath(lp.path);
          } else {
            run = null;                    // a patterned hatch is an area: keep the drawing order round it
            const st = styleOf(it);
            c.batches.push({ k: "hatch", pattern: pat, scale: it.scale, angle: +it.angle || 0,
                             color: st.color, path: lp.path, bbox: lp.bbox, role: it.role });
          }
          break;
        }
        case "text": c.texts.push(it); break;
        case "dim": c.dims.push(it); break;
      }
    }
    compiled.set(drawing, c);
    return c;
  }

  /* all stroke geometry (inserts included) carrying one ref, for the glow */
  function refPath(c, ref) {
    let rp = c.refPaths.get(ref);
    if (rp) return rp;
    const p = new Path2D(), texts = [];
    let any = false;
    for (const it of c.byRef.get(ref) || []) {
      if (it.kind === "text") { texts.push(it); continue; }
      if (it.kind === "insert") {
        const b = (c.drawing.blocks || {})[it.block];
        if (!b) continue;
        const m = matrixOf(it);
        for (const e of compileBlock(b, it.layer).values()) if (e.stroke) { p.addPath(e.stroke, m); any = true; }
        continue;
      }
      if (it.kind === "hatch" || it.kind === "dim") continue;
      if (addGeom(p, it)) any = true;
    }
    rp = { path: any ? p : null, texts };
    c.refPaths.set(ref, rp);
    return rp;
  }

  // ------------------------------------------------------------------ hatch tiles
  /* One square tile per (pattern, colour, size in device px, line width). Every
     pattern is anchored to the world origin, so it does not swim when panning.
     ANSI31 = one 45 degree line through two opposite tile corners (drawn three
     times so it wraps without a seam); DOTS = two staggered dots; GRASS = two
     little tufts like the old generator's yard.                               */
  const tileCache = new Map();
  function tile(ctx, pattern, color, P, lw) {
    const key = pattern + "|" + color + "|" + P + "|" + (lw || 0);
    let t = tileCache.get(key);
    if (t) return t;
    if (tileCache.size > 64) tileCache.clear();
    const cv = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(P, P) : Object.assign(document.createElement("canvas"), { width: P, height: P });
    const g = cv.getContext("2d");
    g.strokeStyle = color; g.fillStyle = color;
    if (pattern === "ANSI31") {
      g.lineWidth = lw || 1;
      g.beginPath();
      for (const o of [-P, 0, P]) { g.moveTo(o - 1, P + 1); g.lineTo(o + P + 1, -1); }
      g.stroke();
    } else if (pattern === "ANSI31R") {
      g.lineWidth = lw || 1;
      g.beginPath();
      for (const o of [-P, 0, P]) { g.moveTo(o - 1, -1); g.lineTo(o + P + 1, P + 1); }
      g.stroke();
    } else if (pattern === "DOTS") {
      const d = Math.max(1.2, P * 0.11);
      g.fillRect(P * 0.2 - d / 2, P * 0.2 - d / 2, d, d);
      g.fillRect(P * 0.7 - d / 2, P * 0.7 - d / 2, d, d);
    } else if (pattern === "GRASS") {
      // two little tufts per tile, staggered: a tall middle blade and two leaning ones
      g.lineWidth = Math.max(1, P * 0.045); g.lineCap = "round";
      const tuft = (x, y, h) => {
        g.beginPath();
        g.moveTo(x, y); g.lineTo(x, y - h);
        g.moveTo(x - h * 0.12, y); g.lineTo(x - h * 0.5, y - h * 0.62);
        g.moveTo(x + h * 0.12, y); g.lineTo(x + h * 0.5, y - h * 0.62);
        g.stroke();
      };
      tuft(P * 0.27, P * 0.42, P * 0.26);
      tuft(P * 0.77, P * 0.92, P * 0.2);
    }
    t = ctx.createPattern(cv, "repeat");
    tileCache.set(key, t);
    return t;
  }
  function hatchSpacing(pattern, scale) {
    const base = HATCH_BASE[pattern];
    if (!base) return 0.2;
    const sp = scale > 0 ? base * scale : HATCH_DEFAULT[pattern];
    const r = HATCH_RANGE[pattern];

  // ------------------------------------------------------------------ the frame
  function draw(ctx, drawing, view, opts) {
    const t0 = performance.now();

    const W = view.w || ctx.canvas.width / dpr, H = view.h || ctx.canvas.height / dpr;

    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.shadowColor = "transparent";
    ctx.setLineDash([]); ctx.lineCap = "butt"; ctx.lineJoin = "round";
    if (opts.background !== false) { ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H); }
    if (!drawing) return { ms: performance.now() - t0, items: 0 };
    const c = compile(drawing);
    const zf = zoomFactor(s);
    const vw = { x0: -ox / s, x1: (W - ox) / s, y0: (oy - H) / s, y1: oy / s };
    const world = () => ctx.setTransform(dpr * s, 0, 0, -dpr * s, dpr * ox, dpr * oy);
    const scr = () => ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // faint room tints (screen only), beneath everything
    if (opts.tints && opts.tints.length) {

    }

    // geometry and hatches, in drawing order

      else drawRun(ctx, b, s, zf, world);
    }
    scr();
    ctx.setLineDash([]);

    // dimensions
    if (c.dims.length) drawDims(ctx, c, s, ox, oy, zf, font, W, H, world, scr);

    // texts
    const labels = opts.labels || null;
    for (const it of c.texts) drawText(ctx, it, s, ox, oy, font, W, H, labels, 1);

    // glow for the highlighted / hovered refs
    const hi = toSet(opts.highlight), hv = toSet(opts.hover);
    if (hi.size || hv.size) {
      for (const ref of hv) if (!hi.has(ref)) glow(ctx, c, ref, 0.55, 7, s, ox, oy, dpr, zf, world, scr, font, W, H);
      for (const ref of hi) glow(ctx, c, ref, 1, 12, s, ox, oy, dpr, zf, world, scr, font, W, H);
    }
    scr();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.setLineDash([]);
    return { ms: performance.now() - t0, items: c.count };
  }

  function toSet(v) {
    if (!v) return new Set();
    if (v instanceof Set) return v;
    if (Array.isArray(v)) return new Set(v);
    return new Set([v]);
  }

  function drawRun(ctx, run, s, zf, world) {
    world();
    for (const g of run.groups.values()) {
      if (!g.fill) continue;
      ctx.globalAlpha = g.fillAlpha;
      ctx.fillStyle = g.st.color;
      ctx.fill(g.fill, "evenodd");
    }
    ctx.globalAlpha = 1;
    for (const g of run.groups.values()) {
      if (!g.stroke) continue;
      ctx.strokeStyle = g.st.color;
      ctx.lineWidth = Math.max(lwPx(g.st.lw, zf) / s, g.st.width);
      const d = DASH[g.st.ltype];
      if (d) {
        let sum = 0; for (const v of d) sum += v;
        ctx.setLineDash(sum * s >= 7 ? d : []);
      } else ctx.setLineDash([]);
      ctx.stroke(g.stroke);
    }
    ctx.setLineDash([]);
  }

  /* A hatch is ONE fill of its loops (even-odd) with a world-anchored tile
     pattern - no clipping, no per-line work - or with a flat translucent colour
     when the pattern would be too fine to see.                               */
  function drawHatch(ctx, b, s, ox, oy, dpr, W, H, vw, zf, world) {
    const bb = b.bbox;
    if (!(bb.x1 >= vw.x0 && bb.x0 <= vw.x1 && bb.y1 >= vw.y0 && bb.y0 <= vw.y1)) return;
    const pat = b.pattern;
    const sp = hatchSpacing(pat, b.scale);
    const spPx = sp * s;
    world();
    let style = b.color, alpha = 1, P = 0, T = 0;
    if (pat === "ANSI31") {
      if (spPx < 2.6) alpha = 0.42;
      else if (Math.abs(b.angle % 90) > 1e-6) { drawLines(ctx, b, sp, s, zf, vw); return; }
      else {
        P = Math.max(3, Math.round(spPx * Math.SQRT2 * dpr));   // horizontal period of 45 degree lines
        T = Math.min(P, 256);
        const flip = Math.abs(Math.round(b.angle / 90)) % 2 === 1;   // 90 / 270: lines the other way
        style = tile(ctx, flip ? "ANSI31R" : pat, b.color, T, Math.min(1.15, 0.85 * zf) * dpr * (T / P));
      }
    } else if (pat === "DOTS" || pat === "GRASS") {
      if (spPx < 1.6) alpha = pat === "DOTS" ? 0.16 : 0.13;
      else {
        // below a legible tile size the texture keeps a minimum screen size (it is a texture,
        // not a measurement)
        P = Math.max(Math.round((pat === "DOTS" ? 6 : 11) * dpr), Math.round(spPx * dpr));
        T = Math.min(P, 256);
        style = tile(ctx, pat, b.color, T, 0);
        if (pat === "GRASS") alpha = 0.9;
      }
    } else alpha = 0.3;
    if (P && style.setTransform) {
      // pattern space -> device: a tile of P device px, a corner on the world origin
      const k = P / T;
      const tx = ((dpr * ox) % P + P) % P, ty = ((dpr * oy) % P + P) % P;
      const ctm = new DOMMatrix([dpr * s, 0, 0, -dpr * s, dpr * ox, dpr * oy]);
      style.setTransform(ctm.inverse().multiply(new DOMMatrix([k, 0, 0, k, tx, ty])));
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = style;
    ctx.fill(b.path, "evenodd");
    ctx.globalAlpha = 1;
  }
  /* ANSI31 at an angle that is not a multiple of 90: real lines, clipped */
  function drawLines(ctx, b, sp, s, zf, vw) {
    const bb = b.bbox;
    const r = { x0: Math.max(bb.x0, vw.x0), x1: Math.min(bb.x1, vw.x1), y0: Math.max(bb.y0, vw.y0), y1: Math.min(bb.y1, vw.y1) };
    const th = (45 + b.angle) * DEG;
    const dx = Math.cos(th), dy = Math.sin(th), nx = -dy, ny = dx;
    let k0 = Infinity, k1 = -Infinity, t0 = Infinity, t1 = -Infinity;
    for (const q of [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]]) {
      const k = q[0] * nx + q[1] * ny, t = q[0] * dx + q[1] * dy;
      if (k < k0) k0 = k; if (k > k1) k1 = k; if (t < t0) t0 = t; if (t > t1) t1 = t;
    }
    const p = new Path2D();
    for (let k = Math.ceil(k0 / sp); k * sp <= k1; k++) {
      const bx = nx * k * sp, by = ny * k * sp;
      p.moveTo(bx + dx * t0, by + dy * t0); p.lineTo(bx + dx * t1, by + dy * t1);
    }
    ctx.save();
    ctx.clip(b.path, "evenodd");
    ctx.strokeStyle = b.color;
    ctx.lineWidth = Math.min(1.15, 0.85 * zf) / s;
    ctx.stroke(p);
    ctx.restore();
  }
  // ------------------------------------------------------------------ dimensions (the old generator's look)
  /* The geometry comes from HP.drawing.dimGeometry when it is there - the very
     lines, ticks and text spot dxf.js writes - so the screen and the DXF agree.
     Only two things are screen-only: the oblique ticks never shrink below ~4 px,
     and the text never gets smaller than a legible minimum.                   */
  const DIM_FALLBACK = { text: 0.18, small: 0.12, tick: 0.06, exo: 0.06, exe: 0.08, gap: 0.05 };
  function dimGeom(it) {
    if (HP.drawing && HP.drawing.dimGeometry) return HP.drawing.dimGeometry(it);
    const S = DIM_FALLBACK;
    const th = (+it.rot || 0) * DEG, u = [Math.cos(th), Math.sin(th)], v = [-u[1], u[0]];
    const proj = p => { const t = (p[0] - it.d[0]) * u[0] + (p[1] - it.d[1]) * u[1]; return [it.d[0] + u[0] * t, it.d[1] + u[1] * t]; };
    const pa = proj(it.a), pb = proj(it.b);
    const lines = [[pa, pb]];
    for (const [p, q] of [[it.a, pa], [it.b, pb]]) {
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);
      if (L > S.exo) { const w = [dx / L, dy / L]; lines.push([[p[0] + w[0] * S.exo, p[1] + w[1] * S.exo], [q[0] + w[0] * S.exe, q[1] + w[1] * S.exe]]); }
    }
    const k = [(u[0] + v[0]) * S.tick, (u[1] + v[1]) * S.tick];
    const ticks = [pa, pb].map(p => [[p[0] - k[0], p[1] - k[1]], [p[0] + k[0], p[1] + k[1]]]);
    const h = it.h || (it.small ? S.small : S.text);
    const mid = [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2];
    const tp = it.tp || [mid[0] + v[0] * (S.gap + h / 2), mid[1] + v[1] * (S.gap + h / 2)];
    return { pa, pb, lines, ticks, measure: Math.hypot(pb[0] - pa[0], pb[1] - pa[1]), text: { p: tp, h, rot: +it.rot || 0, text: it.text, align: "mc" } };
  }
  /* compiled once per drawing: dimension + extension lines as one world path per colour,
     ticks and texts kept as data for the per-frame screen work */
  function compileDims(c) {
    if (c.dimc) return c.dimc;
    const byColor = new Map(), ticks = [], texts = [];
    const L = layerOf("A-ANNO-DIMS");
    for (const it of c.dims) {
      let g;
      try { g = dimGeom(it); } catch (e) { continue; }
      const color = it.color || L.color;
      let e = byColor.get(color);
      if (!e) { e = { color, path: new Path2D(), bb: { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity } }; byColor.set(color, e); }
      for (const ln of g.lines) {
        e.path.moveTo(ln[0][0], ln[0][1]); e.path.lineTo(ln[1][0], ln[1][1]);
      }
      for (const t of g.ticks) ticks.push({ color, c: [(t[0][0] + t[1][0]) / 2, (t[0][1] + t[1][1]) / 2], d: [(t[1][0] - t[0][0]) / 2, (t[1][1] - t[0][1]) / 2] });
      if (it.text) texts.push({ it, p: g.text.p, h: g.text.h, rot: g.text.rot, measure: g.measure, small: !!it.small, color: it.textColor || L.text || "#8fe6f0" });
    }
    c.dimc = { byColor, ticks, texts };
    return c.dimc;
  }
  function drawDims(ctx, c, s, ox, oy, zf, font, W, H, world, scr) {
    const dc = compileDims(c);
    world();
    ctx.lineWidth = Math.min(1.25, 0.95 * zf) / s;
    for (const e of dc.byColor.values()) { ctx.strokeStyle = e.color; ctx.stroke(e.path); }
    scr();
    // ticks in screen space so they stay visible when zoomed out
    const tp = new Map();
    for (const t of dc.ticks) {
      const cx = ox + t.c[0] * s, cy = oy - t.c[1] * s;
      if (cx < -20 || cx > W + 20 || cy < -20 || cy > H + 20) continue;
      let dx = t.d[0] * s, dy = -t.d[1] * s;
      const L = Math.hypot(dx, dy), min = 4.2 * Math.min(zf, 1.15);
      if (L < min && L > 0) { dx *= min / L; dy *= min / L; }
      let p = tp.get(t.color);
      if (!p) { p = new Path2D(); tp.set(t.color, p); }
      p.moveTo(cx - dx, cy - dy); p.lineTo(cx + dx, cy + dy);
    }
    ctx.lineWidth = Math.min(1.6, 1.25 * zf);
    for (const [color, p] of tp) { ctx.strokeStyle = color; ctx.stroke(p); }
    // texts: never upside down, never below a legible size
    const cap = capOf();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    for (const t of dc.texts) {
      const x = ox + t.p[0] * s, y = oy - t.p[1] * s;
      if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
      let px = t.h / cap * s;
      px = Math.max(px, t.small ? 5.5 : 7);
      const lenPx = t.measure * s;
      if (t.small && px * 1.6 > lenPx + 14) continue;          // a wall-thickness text with no room left
      ctx.font = (t.small ? "500 " : "600 ") + px.toFixed(2) + "px " + font;
      ctx.fillStyle = t.color;
      let rot = ((t.rot % 360) + 360) % 360;
      if (rot > 90 && rot <= 270) rot -= 180; else if (rot > 270) rot -= 360;
      if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(-rot * DEG); ctx.fillText(t.it.text, 0, 0); ctx.restore(); }
      else ctx.fillText(t.it.text, x, y);
    }
  }

  // ------------------------------------------------------------------ texts
  const ROLE_STYLE = {
    "room-name": { weight: 650, upper: true, spacing: 0.07, alpha: 1 },
    "room-area": { weight: 500, upper: false, spacing: 0.01, alpha: 0.72 },
    "room-size": { weight: 500, upper: false, spacing: 0, alpha: 0.8, mono: true },
    "road-label": { weight: 600, upper: true, spacing: 0.45, alpha: 0.9, nofit: true },
    "section-label": { weight: 700, upper: true, spacing: 0, alpha: 1 },
  };
  const LABEL_ROLES = { "room-name": 1, "room-area": 1, "room-size": 1 };
  const FLIP_ALIGN = { ml: "mr", mr: "ml", bc: "tc", tc: "bc", bl: "tr", tr: "bl", mc: "mc", tl: "br", br: "tl" };

  function drawText(ctx, it, s, ox, oy, font, W, H, labels, alpha) {
    let px = (+it.h || 0.2) / capOf() * s;
    if (px < 3.5 || !it.text) return;
    const x = ox + it.p[0] * s, y = oy - it.p[1] * s;
    if (x < -400 || x > W + 400 || y < -100 || y > H + 100) return;
    const rs = ROLE_STYLE[it.role] || { weight: 500, upper: false, spacing: 0, alpha: 1 };
    let rot = +it.rot || 0;
    let align = it.align || "mc";
    rot = ((rot % 360) + 360) % 360;
    if (rot > 90 && rot <= 270) { rot -= 180; align = FLIP_ALIGN[align] || align; }   // never upside down
    else if (rot > 270) rot -= 360;
    const text = rs.upper ? String(it.text).toUpperCase() : String(it.text);
    const fam = rs.mono ? MONO : font;
    ctx.font = rs.weight + " " + px.toFixed(2) + "px " + fam;
    let ls = rs.spacing * px;
    const hasLS = "letterSpacing" in ctx;
    if (hasLS) ctx.letterSpacing = ls.toFixed(2) + "px";
    let mw = ctx.measureText(text).width;
    // keep to the width the drawing laid the text out for (it fitted the label to the room)
    const target = it.w > 0 && !rs.nofit ? it.w * s : 0;
    if (target && mw > target * 1.04) {
      if (ls && hasLS) { ls = 0; ctx.letterSpacing = "0px"; mw = ctx.measureText(text).width; }
      if (mw > target * 1.04) {
        px *= target * 1.02 / mw;
        ctx.font = rs.weight + " " + px.toFixed(2) + "px " + fam;
        mw = ctx.measureText(text).width;
      }
    }
    const v = align[0], h = align[1] || "c";
    ctx.textAlign = h === "l" ? "left" : h === "r" ? "right" : "center";
    ctx.textBaseline = v === "m" ? "middle" : v === "t" ? "top" : "alphabetic";
    ctx.fillStyle = it.color || layerOf(it.layer).color;
    ctx.globalAlpha = rs.alpha * (alpha == null ? 1 : alpha);
    if (rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(-rot * DEG); ctx.fillText(text, 0, 0); ctx.restore();
    } else ctx.fillText(text, x, y);
    ctx.globalAlpha = 1;
    if (labels && LABEL_ROLES[it.role] && it.ref != null) {

  function placeTip(p) {
    const x = clamp(p.x + 16, 6, Math.max(6, W - 300)), y = clamp(p.y + 20, 6, Math.max(6, H - 40));
    tipEl.style.transform = "translate(" + x.toFixed(0) + "px," + y.toFixed(0) + "px)";
  }
  function hideTip() {
    clearTimeout(tip.timer);
    if (tipEl && tip.shown) { tipEl.classList.remove("is-on"); }
    tip.shown = false;
  }

  // ------------------------------------------------------------------ pointer: board
  function onDown(e) {
    closeMenu();
    if (drag) return;
    if (e.button === 2) return;                            // the context menu handles it
    refreshRect();
    const p = local(e);
    lastPtr = p;
    if (e.button === 1) e.preventDefault();               // no autoscroll
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
    try { cv.focus({ preventScroll: true }); } catch (err) { /* old browsers */ }
    hideTip();
    if (HP.store.get() !== HP.store.committed()) HP.store.cancel();   // a stray preview
    const start = HP.store.get();
    const hit = (e.button === 0 && !spaceDown) ? hitTest(p.x, p.y) : { t: "bg" };
    const pan = e.button === 1 || spaceDown || hit.t === "land" || hit.t === "bg" || hit.t === "room";
    drag = {
      pointerId: e.pointerId, button: e.button, p0: p, w0: [WX(p.x), WY(p.y)], hit, start,
      A0: analysisOf(start), moved: false, pan, view0: { scale: VIEW.scale, ox: VIEW.ox, oy: VIEW.oy },
      last: null, lastOk: null, chips: [], ghost: null, swap: null, alt: e.altKey, p: p,
    };
    if (pan) setCursor("grabbing");
    else if (hit.t === "label" || hit.t === "opening" || hit.t === "corner" || (hit.t === "section" && hit.part !== "line")) setCursor("grabbing");
  }
  function onMove(e) {
    const p = local(e);
    lastPtr = p;
    if (!drag) { if (!menuOpen) updateHover(p); return; }
    if (drag.type === "palette" || e.pointerId !== drag.pointerId) return;
    drag.p = p; drag.alt = e.altKey;
    if (!drag.moved) {
      if (Math.hypot(p.x - drag.p0.x, p.y - drag.p0.y) < DRAG_PX) return;
      drag.moved = true;
      if (!drag.pan) HP.store.setHover(storeHoverOf(drag.hit));
    }
    dragMove();
    requestDraw();          // a move may change only the ghost / chips, not the plan
    flush();
  }
  function onUp(e) {
    if (!drag || drag.type === "palette" || e.pointerId !== drag.pointerId) return;
    const d = drag;
    drag = null;
    try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* fine */ }
    if (!d.moved) click(d, e);
    else if (!d.pan) finishDrag(d);
    const p = local(e);
    lastPtr = p;
    hoverT = null;
    updateHover(p, true);
    redraw();
  }
  function onCancel(e) {
    if (!drag || drag.type === "palette" || e.pointerId !== drag.pointerId) return;
    cancelDrag();
  }
  function cancelDrag() {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.type === "palette") detachPalette();
    else { try { cv.releasePointerCapture(d.pointerId); } catch (err) { /* fine */ } }
    if (d.view0 && d.pan) { /* a pan just stays where it is */ }
    HP.store.cancel();
    hoverT = null;
    if (lastPtr) updateHover(lastPtr, true);
    redraw();
  }

  function click(d, e) {
    const h = d.hit;
    switch (h.t) {
      case "label": case "room": HP.store.select({ kind: "room", id: h.id }); break;
      case "opening": HP.store.select({ kind: "opening", id: h.id }); break;
      case "section":
        if (h.part === "line") HP.store.select({ kind: "section", id: h.id });
        else {
          const r = op("flipSection", HP.store.get(), h.id);
          commitResult(r, "Turn the section view", { kind: "section", id: h.id });
        }
        break;
      case "corner": HP.store.select({ kind: "plot", id: h.i }); break;
      case "wall": {
        // a click on a wall selects the room on the side that was clicked
        const A = d.A0, w = d.w0;
        const off = (d.hit.h.orient === "v" ? w[0] : w[1]) - d.hit.h.pos;
        const m = memberOnSide(A, d.hit.h, w, off);
        HP.store.select(m ? { kind: "room", id: m } : null);
        break;
      }
      default:
        if (d.button === 0) HP.store.select(HP.store.tool() === "plot" ? { kind: "plot", id: null } : null);
    }
  }

  /* the member room of a wall handle on the pointer's side of the centre line */
  function memberOnSide(A, h, w, off) {
    const along = h.orient === "v" ? w[1] : w[0];
    let best = null, bd = Infinity;
    for (const m of h.members || []) {
      const r = (A.rooms || []).find(q => q.id === m.room);
      if (!r) continue;
      const s0 = h.orient === "v" ? r.y : r.x, s1 = s0 + (h.orient === "v" ? r.h : r.w);
      const da = along < s0 ? s0 - along : along > s1 ? along - s1 : 0;
      // E/N sides lie on the low side of the line, W/S on the high side
      const low = m.side === "E" || m.side === "N";
      const sideOk = off === 0 ? 1 : ((off < 0) === low ? 0 : 1);
      const d = da + sideOk * 1e5;
      if (d < bd) { bd = d; best = m.room; }
    }
    return best;
  }

  // ------------------------------------------------------------------ drags on the board
  function dragMove() {
    const d = drag, p = d.p, h = d.hit;
    const w = [WX(p.x), WY(p.y)];
    d.ghost = null; d.chips = []; d.swap = null;
    if (d.pan) {
      VIEW.ox = d.view0.ox + (p.x - d.p0.x);
      VIEW.oy = d.view0.oy + (p.y - d.p0.y);
      emitView(); requestDraw();
      return;
    }
    const t0 = now();
    switch (h.t) {
      case "label": moveRoomDrag(d, w); break;
      case "wall": wallDrag(d, w); break;
      case "opening": openingDrag(d, w); break;
      case "section": sectionDrag(d, w); break;
      case "corner": cornerDrag(d, w); break;
    }
    d.opMs = now() - t0;
  }

  function moveRoomDrag(d, w) {
    const id = d.hit.id, A0 = d.A0;
    const r0 = d.start.rooms.find(r => r.id === id);
    if (!r0 || !A0) return;
    const other = roomAt(A0, w, id);
    let res;
    if (other) {
      res = op("swapRooms", d.start, id, other.id);
      d.swap = other;
      if (res && res.ok) {
        d.chips.push({ cls: "swap", text: "Swap with " + other.name, w: [w[0], w[1]], dx: 0, dy: -34 });
        HP.store.preview(res.state);
      } else {
        HP.store.preview(d.start);
        d.ghost = { kind: "rect", x: other.x, y: other.y, w: other.w, h: other.h };
        d.chips.push({ cls: "reason", text: (res && res.reason) || "These two rooms can't swap.", w, dx: 16, dy: 22, left: true });
      }
    } else {
      const tx = snap5(r0.x + w[0] - d.w0[0]), ty = snap5(r0.y + w[1] - d.w0[1]);
      res = op("moveRoom", d.start, id, tx, ty, { snap: Math.round(pxToCm(10)) });
      if (res) {
        HP.store.preview(res.state);
        if (!res.ok) {
          d.ghost = { kind: "rect", x: tx, y: ty, w: r0.w, h: r0.h };
          if (res.reason) d.chips.push({ cls: "reason", text: res.reason, w, dx: 16, dy: 22, left: true });
        }
      }
    }
    d.last = res;
  }

  function wallDrag(d, w) {
    const h = d.hit.h;
    const axis = h.orient === "v" ? 0 : 1;
    const delta = snap5(w[axis] - d.w0[axis]);
    if (d.only === undefined) {
      const off = d.w0[axis] - h.pos;
      d.only = memberOnSide(d.A0, h, d.w0, off);
    }
    const res = op("dragWall", d.start, d.hit.key, delta, { only: d.alt ? d.only : null });
    d.last = res;
    if (!res) return;
    HP.store.preview(res.state);
    // live size read-outs for every room that changed
    const byId = new Map(d.start.rooms.map(r => [r.id, r]));
    for (const r of res.state.rooms) {
      const r0 = byId.get(r.id);
      if (!r0) continue;
      const dw = r.w !== r0.w, dh = r.h !== r0.h;
      if (!dw && !dh) continue;
      if (h.orient === "v" && dw) {
        const y = clamp(w[1], r.y + Math.min(60, r.h * 0.25), r.y + r.h - Math.min(60, r.h * 0.25));
        d.chips.push({ cls: "size", text: HP.fmtM(r.w), w: [r.x + r.w / 2, y], arrow: "h" });
      } else if (h.orient === "h" && dh) {
        const x = clamp(w[0], r.x + Math.min(60, r.w * 0.25), r.x + r.w - Math.min(60, r.w * 0.25));
        d.chips.push({ cls: "size", text: HP.fmtM(r.h), w: [x, r.y + r.h / 2], arrow: "v" });
      } else {
        d.chips.push({ cls: "size", text: HP.fmtM(r.w) + " \u00d7 " + HP.fmtM(r.h), w: [r.x + r.w / 2, r.y + r.h / 2] });
      }
    }
    if (!res.ok && res.reason) d.chips.push({ cls: "reason", text: res.reason, w, dx: 16, dy: 22, left: true });
  }

  function openingDrag(d, w) {
    const id = d.hit.id, A0 = d.A0;
    const o0 = (A0.openings || []).find(o => o.id === id);
    if (!o0) return;
    if (!d.off) { const c = openingCentre(o0); d.off = [c[0] - d.w0[0], c[1] - d.w0[1]]; d.o0 = o0; }
    const pt = [snap5(w[0] + d.off[0]), snap5(w[1] + d.off[1])];
    const res = op("moveOpening", d.start, id, pt, { analysis: A0 });
    d.last = res;
    if (res && res.ok) { HP.store.preview(res.state); d.lastOk = res; return; }
    // not legal: keep the last legal preview, show a red ghost at the pointer + the reason
    const curA = analysisOf(HP.store.get());
    const cur = curA && (curA.openings || []).find(o => o.id === id);
    const nh = nearestHandle(A0, pt);
    const axis = nh ? (nh.orient === "v" ? "y" : "x") : (cur || o0).axis;
    d.ghost = { kind: "bar", c: pt, len: o0.w, axis, thick: (HP.store.get().walls || {}).ext || 20 };
    d.chips.push({ cls: "reason", text: (res && res.reason) || "It can't go here.", w, dx: 18, dy: 24, left: true });
  }

  function sectionDrag(d, w) {
    const id = d.hit.id, part = d.hit.part;
    let res;
    if (part === "line") res = op("moveSection", d.start, id, { dx: snap5(w[0] - d.w0[0]), dy: snap5(w[1] - d.w0[1]) });
    else res = op("moveSection", d.start, id, { [part]: [snap5(w[0]), snap5(w[1])] });
    d.last = res;
    if (res) HP.store.preview(res.state);
    if (res && !res.ok && res.reason) d.chips.push({ cls: "reason", text: res.reason, w, dx: 16, dy: 22, left: true });
  }

  function cornerDrag(d, w) {
    const res = op("movePlotCorner", d.start, d.hit.i, [snap5(w[0]), snap5(w[1])]);
    d.last = res;
    if (res) HP.store.preview(res.state);
    if (res && !res.ok) {
      d.ghost = { kind: "dot", c: [snap5(w[0]), snap5(w[1])] };
      if (res.reason) d.chips.push({ cls: "reason", text: res.reason, w, dx: 16, dy: 22, left: true });
    }
  }

  function finishDrag(d) {
    const cur = HP.store.get();
    if (cur === HP.store.committed()) { HP.store.cancel(); return; }
    const h = d.hit;
    let lbl = "Edit", sel = null;
    switch (h.t) {
      case "label": lbl = d.swap ? "Swap rooms" : "Move room"; sel = { kind: "room", id: h.id }; break;
      case "wall": lbl = "Move wall"; break;
      case "opening": lbl = h.kind === "door" ? "Move door" : "Move window"; sel = { kind: "opening", id: h.id }; break;
      case "section": lbl = h.part === "line" ? "Move section" : "Lengthen section"; sel = { kind: "section", id: h.id }; break;
      case "corner": lbl = "Move land corner"; sel = { kind: "plot", id: h.i }; break;
    }
    HP.store.commit(cur, lbl);
    if (sel) HP.store.select(sel);
    const res = h.t === "opening" ? d.lastOk : d.last;
    if (res && res.note) HP.store.toast(res.note, "info");
  }

  // ------------------------------------------------------------------ palette drops
  function itemLabel(it) {
    if (it.kind === "room") return label(it.type);
    if (it.kind === "door") return "door";
    if (it.kind === "window") return "window";
    return "section";
  }
  function paletteOp(start, item, pt) {
    switch (item.kind) {
      case "room": return op("addRoom", start, item.type, pt);
      case "door": return op("addOpening", start, "door", item.w || 80, pt, { analysis: analysisOf(start) });
      case "window": return op("addOpening", start, "window", item.w || 120, pt, { analysis: analysisOf(start) });
      case "section": return op("addSection", start, pt);
    }
    return null;
  }
  function selOf(item, id) {
    if (!id) return null;
    if (item.kind === "room") return { kind: "room", id };
    if (item.kind === "door" || item.kind === "window") return { kind: "opening", id };
    if (item.kind === "section") return { kind: "section", id };
    return null;
  }
  function startPalette(item, ev) {
    if (!inited || !item) return;
    if (drag) cancelDrag();
    closeMenu(); hideTip();
    if (HP.store.get() !== HP.store.committed()) HP.store.cancel();
    drag = { type: "palette", item, start: HP.store.get(), A0: analysisOf(HP.store.get()), pointerId: ev ? ev.pointerId : null,
             last: null, chips: [], ghost: null, over: false, key: "" };
    document.addEventListener("pointermove", onPalMove, true);
    document.addEventListener("pointerup", onPalUp, true);
    document.addEventListener("pointercancel", onPalCancel, true);
    if (ev && ev.clientX != null) onPalMove(ev);
  }
  function detachPalette() {
    document.removeEventListener("pointermove", onPalMove, true);
    document.removeEventListener("pointerup", onPalUp, true);
    document.removeEventListener("pointercancel", onPalCancel, true);
  }
  function overBoard(e) {
    refreshRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return false;
    // something on top of the board (a panel, a menu) does not count
    const top = document.elementFromPoint ? document.elementFromPoint(e.clientX, e.clientY) : null;
    return !top || top === cv || ov.contains(top) || stage === top;
  }
  function onPalMove(e) {
    const d = drag;
    if (!d || d.type !== "palette") return;
    if (d.pointerId != null && e.pointerId != null && e.pointerId !== d.pointerId) return;
    const p = local(e);
    lastPtr = p;
    d.p = p; d.chips = []; d.ghost = null;
    d.over = overBoard(e);
    if (!d.over) {
      if (HP.store.get() !== d.start) HP.store.preview(d.start);
      d.last = null; d.key = "";
      setCursor("default");
      requestDraw(); flush();
      return;
    }
    setCursor("copy");
    const pt = [snap5(WX(p.x)), snap5(WY(p.y))];
    const key = pt[0] + "," + pt[1];
    if (key === d.key && d.lastPt) { d.chips = d.lastChips || []; d.ghost = d.lastGhost || null; requestDraw(); flush(); return; }
    d.key = key;
    const t0 = now();
    const res = paletteOp(d.start, d.item, pt);
    d.opMs = now() - t0;
    d.last = res;
    if (res && res.ok) {
      HP.store.preview(res.state);
    } else {
      if (HP.store.get() !== d.start) HP.store.preview(d.start);
      if (d.item.kind === "room") {
        const sz = (HP.ROOM_TYPES[d.item.type] || { size: [300, 300] }).size;
        d.ghost = { kind: "rect", x: pt[0] - sz[0] / 2, y: pt[1] - sz[1] / 2, w: sz[0], h: sz[1] };
      } else if (d.item.kind === "section") {
        d.ghost = { kind: "dot", c: pt };
      } else {
        const nh = d.A0 && nearestHandle(d.A0, pt);
        d.ghost = { kind: "bar", c: pt, len: d.item.w || 100, axis: nh && nh.orient === "v" ? "y" : "x", thick: (d.start.walls || {}).ext || 20 };
      }
      d.chips.push({ cls: "reason", text: (res && res.reason) || ("The " + itemLabel(d.item) + " can't go here."), w: [WX(p.x), WY(p.y)], dx: 18, dy: 24, left: true });
    }
    d.lastPt = pt; d.lastChips = d.chips; d.lastGhost = d.ghost;
    requestDraw(); flush();
  }
  function onPalUp(e) {
    const d = drag;
    if (!d || d.type !== "palette") return;
    if (d.pointerId != null && e.pointerId != null && e.pointerId !== d.pointerId) return;
    detachPalette();
    drag = null;
    const over = overBoard(e);
    if (over && d.last && d.last.ok) {
      const lbl = "Add " + (d.item.kind === "room" ? label(d.item.type) : itemLabel(d.item));
      HP.store.commit(d.last.state, lbl);
      HP.store.select(selOf(d.item, d.last.id));
      if (d.last.note) HP.store.toast(d.last.note, "info");
    } else {
      HP.store.cancel();
      if (over && d.last && !d.last.ok && d.last.reason) HP.store.toast(d.last.reason, "warn");
    }
    lastPtr = over ? local(e) : null;
    hoverT = null;
    if (lastPtr) updateHover(lastPtr, true); else setCursor("default");
    redraw();
  }
  function onPalCancel() {
    if (drag && drag.type === "palette") cancelDrag();
  }
  function clickPalette(item) {
    if (!inited || !item) return;
    if (drag) cancelDrag();
    const start = HP.store.committed();
    if (HP.store.get() !== start) HP.store.cancel();
    const pt = [snap5(WX(W / 2)), snap5(WY(H / 2))];
    const res = paletteOp(start, item, pt);
    if (!res) return;
    if (!res.ok) { HP.store.toast(res.reason || ("There is no room for the " + itemLabel(item) + " here."), "warn"); return; }
    HP.store.commit(res.state, "Add " + (item.kind === "room" ? label(item.type) : itemLabel(item)));
    const sel = selOf(item, res.id);
    HP.store.select(sel);
    if (res.note) HP.store.toast(res.note, "info");
    if (res.id) focus([res.id]);
  }

  // ------------------------------------------------------------------ double-click, wheel, context menu
  function onDbl(e) {
    refreshRect();
    const p = local(e), h = hitTest(p.x, p.y), plan = HP.store.get();
    if (h.t === "opening" && h.kind === "door") {
      commitResult(op("flipDoor", plan, h.id, "swing"), "Turn door", { kind: "opening", id: h.id });
    } else if (h.t === "edge") {
      const res = op("addPlotCorner", plan, h.i, [snap5(WX(p.x)), snap5(WY(p.y))]);
      if (commitResult(res, "Add land corner")) HP.store.select({ kind: "plot", id: h.i + 1 });
    }
  }
  function onWheel(e) {
    e.preventDefault();
    if (drag && drag.pan) return;
    closeMenu();
    refreshRect();
    const p = local(e);
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= H || 800;
    const f = clamp(Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0016)), 0.5, 2);
    zoomBy(f, p.x, p.y);
    if (drag && drag.moved && !drag.pan && drag.type !== "palette") { dragMove(); requestDraw(); }
    else if (!drag) { lastPtr = p; hoverT = null; updateHover(p); }
    flush();
  }
  function onContext(e) {
    e.preventDefault();
    if (drag) return;
    refreshRect();
    const p = local(e), h = hitTest(p.x, p.y), plan = HP.store.get();
    const items = [];
    const furnNext = (id) => {
      const r = plan.rooms.find(q => q.id === id);
      const vars = (HP.furniture && HP.furniture.variants && r) ? HP.furniture.variants(r.type) : [];
      if (!r || vars.length < 2) return null;
      const next = ((r.furn | 0) + 1) % vars.length;
      return () => commitResult(op("setFurniture", HP.store.get(), id, next), "Furniture: " + vars[next].label, { kind: "room", id });
    };
    if (h.t === "label" || h.t === "room") {
      HP.store.select({ kind: "room", id: h.id });
      const fn = furnNext(h.id);
      items.push({ text: "Next furniture layout", act: fn, off: !fn });
      items.push({ text: "Zoom to this room", act: () => focus([h.id]) });
      items.push({ sep: true });
      items.push({ text: "Delete room", key: "Del", act: () => commitResult(op("removeRoom", HP.store.get(), h.id), "Delete room"), bad: true });
    } else if (h.t === "opening") {
      HP.store.select({ kind: "opening", id: h.id });
      if (h.kind === "door") {
        items.push({ text: "Flip swing (in / out)", act: () => commitResult(op("flipDoor", HP.store.get(), h.id, "swing"), "Flip door swing", { kind: "opening", id: h.id }) });
        items.push({ text: "Flip hinge side", act: () => commitResult(op("flipDoor", HP.store.get(), h.id, "hinge"), "Flip door hinge", { kind: "opening", id: h.id }) });
        items.push({ sep: true });
      }
      items.push({ text: h.kind === "door" ? "Delete door" : "Delete window", key: "Del", act: () => commitResult(op("removeOpening", HP.store.get(), h.id), h.kind === "door" ? "Delete door" : "Delete window"), bad: true });
    } else if (h.t === "section") {
      HP.store.select({ kind: "section", id: h.id });
      items.push({ text: "Look the other way", act: () => commitResult(op("flipSection", HP.store.get(), h.id), "Turn the section view", { kind: "section", id: h.id }) });
      items.push({ text: "Turn the section 90\u00b0", act: () => commitResult(op("turnSection", HP.store.get(), h.id), "Turn section", { kind: "section", id: h.id }) });
      items.push({ sep: true });
      items.push({ text: "Delete section", key: "Del", act: () => commitResult(op("removeSection", HP.store.get(), h.id), "Delete section"), bad: true });
    } else if (h.t === "corner") {
      HP.store.select({ kind: "plot", id: h.i });
      items.push({ text: "Remove this corner", key: "Del", act: () => commitResult(op("removePlotCorner", HP.store.get(), h.i), "Remove land corner"), bad: true, off: plan.plot.pts.length <= 3 });
    } else if (h.t === "edge") {
      const pt = [snap5(WX(p.x)), snap5(WY(p.y))];

      '<rect x="3" y="15" width="8" height="18" rx="2.5"/><rect x="37" y="15" width="8" height="18" rx="2.5"/>' +
      '<rect x="16.5" y="17.5" width="15" height="13" rx="2"/>',
    kitchen: '<path d="M4 4h40v13H17v27H4z"/><circle cx="27" cy="10.5" r="3.2"/><circle cx="37" cy="10.5" r="3.2"/>' +
      '<rect x="6.5" y="23" width="8" height="11" rx="2"/><circle cx="10.5" cy="28.5" r="1" class="f"/>',
    bath: '<rect x="5" y="6" width="38" height="19" rx="4"/><rect x="8.5" y="9.5" width="31" height="12" rx="5.5"/>' +
      '<circle cx="35" cy="15.5" r="1.2" class="f"/><rect x="8" y="31" width="14" height="12" rx="2.5"/>' +
      '<ellipse cx="15" cy="37" rx="4" ry="3"/><path d="M30 31h13v12H30zM30 31l13 12M43 31 30 43"/>',
    wc: '<rect x="15" y="5" width="18" height="8" rx="1.8"/><path d="M17 13h14v6c0 9-3.2 16-7 16s-7-7-7-16z"/>' +
      '<ellipse cx="24" cy="22" rx="4" ry="6.5"/>',
    open: '<circle cx="24" cy="24" r="7"/><path d="M24 7v5M24 36v5M7 24h5M36 24h5M12 12l3.5 3.5M32.5 32.5 36 36M36 12l-3.5 3.5M15.5 32.5 12 36"/>',
    hall: '<path d="M42 6v13M42 29v13M6 24h28M27 17l7 7-7 7"/><path d="M6 6v36" class="d"/>',
  };
  function doorPict() {
    return '<path d="M3 40h9M38 40h7" class="w"/><path d="M12 40V14"/><path d="M12 14A26 26 0 0 1 38 40" class="d"/>';
  }
  function winPict(w) {
    const L = Math.round(14 + (w - 60) / (250 - 60) * 26);      // 14..40 px: wider window, wider symbol
    const x0 = 24 - L / 2, x1 = 24 + L / 2;
    return `<path d="M2 18h${x0 - 2}M2 30h${x0 - 2}M${x1} 18h${46 - x1}M${x1} 30h${46 - x1}" class="w"/>` +
      `<path d="M${x0} 18v12M${x1} 18v12M${x0} 21h${L}M${x0} 24h${L}M${x0} 27h${L}"/>`;
  }
  function sectionPict() {
    return '<path d="M3 34h11M18 34h3M25 34h11" class="d"/><path d="M33 34h12" class="w"/>' +
      '<path d="M33 30h12l-6-10z" class="f"/><text x="12" y="25" class="t">A</text>';
  }
  const pict = (inner, cls) =>
    `<svg viewBox="0 0 48 48" class="pn-pict${cls ? " " + cls : ""}" aria-hidden="true" focusable="false">${inner}</svg>`;

  function hexA(hex, a) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return `rgba(22,182,201,${a})`;
    const n = parseInt(m[1], 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  }

  // ======================================================== state of the panels
  const PREF_KEY = "houseplanner.panels.v1";
  const UI = {
    roots: null,
    collapsed: {},           // card id -> true
    units: "m",
    msg: {},                 // card id -> {text, level}
    zoom: null,              // px per metre from the canvas 'view' event
    zoomPct: null,
    last: null,              // last message {text, level, t}
    showPassing: false,      // the rules that pass are folded into one line
  };
  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
      if (p && typeof p === "object") {
        if (p.collapsed && typeof p.collapsed === "object") UI.collapsed = p.collapsed;
        if (["m", "cm", "mm"].includes(p.units)) UI.units = p.units;
        UI.showPassing = !!p.showPassing;
      }
    } catch (e) { /* storage off: defaults */ }
  }
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify({ collapsed: UI.collapsed, units: UI.units, showPassing: UI.showPassing })); }
    catch (e) { /* fine */ }
  }

  const plan = () => HP.store.get();
  function analysis() {
    if (typeof HP.analyze !== "function") return null;
    try { return HP.store.analysis(); } catch (e) { console.error("[panels] analyze failed", e); return null; }
  }
  const roomById = (P, id) => P.rooms.find(r => r.id === id);
  const roomName = (P, id) => { const r = roomById(P, id); return r ? r.name : "?"; };
  const typeLabel = t => (HP.ROOM_TYPES[t] ? HP.ROOM_TYPES[t].label : t);

  // ======================================================== running model ops
  /* run(op, args, label, where): call HP.model[op](plan, ...args), commit the
     new plan under `label`, show `reason` inline in card `where` (or as a
     toast when where is null) and `note` as a toast.                         */
  function run(op, args, label, where) {
    const M = HP.model;
    if (!M || typeof M[op] !== "function") { say(where, fill(T.notReady, { op: "model." + op }), "error"); return null; }
    const before = HP.store.get();
    let res;
    try { res = M[op](before, ...args); }
    catch (e) { console.error("[panels] model." + op + " failed", e); say(where, T.failed, "error"); return null; }
    if (!res) return null;
    const changed = !!res.state && res.state !== before;
    if (res.ok === false) setMsg(where || "_", res.reason || T.cannot, "warn");
    else delete UI.msg[where || "_"];
    if (changed) HP.store.commit(res.state, label);
    if (res.ok === false && !where) toast(res.reason || T.cannot, "warn");
    if (res.note) toast(res.note, "info");
    renderAll();
    return res;
  }
  function say(where, text, level) {
    if (where) { setMsg(where, text, level); renderSidebar(); }
    else toast(text, level);
  }
  // a card's message line; it goes away by itself after MSG_MS so an old reason never lingers
  const MSG_MS = 10000;
  function setMsg(where, text, level) {
    UI.msg[where] = { text, level, t: Date.now() };
    clearTimeout(setMsg.timer);
    setMsg.timer = setTimeout(renderSidebar, MSG_MS + 50);
  }
  function msgLine(where) {
    const m = UI.msg[where];
    if (!m) return null;
    if (Date.now() - m.t > MSG_MS) { delete UI.msg[where]; return null; }
    return h("div", { class: "pn-msg is-" + m.level, role: "alert", key: "msg-" + where },
      icon(m.level === "error" ? "warn" : "info", 14), h("span", null, m.text));
  }

  // ======================================================== form pieces
  function parseM(str) {
    const t = String(str).trim().replace(",", ".").replace(/\s*m$/i, "");
    if (!/^-?\d*\.?\d+$|^-?\d+\.$/.test(t)) return null;
    const v = Number(t);
    return isFinite(v) ? v : null;
  }
  const toCm = v => HP.snap(Math.round(v * 100));

  /* A metre field. `cm` = shown value; commit(cm) is called with a 5 cm value
     on Enter, blur, or ArrowUp/ArrowDown (Shift = 0.50 m).                    */
  function mField(key, label, cm, commit, opts) {
    const o = opts || {};
    const finish = (el, v) => {
      el._dirty = false;
      if (v == null) { say(o.where, T.badNumber, "warn"); el.value = el._value; return; }
      commit(v);
    };
    const input = h("input", {
      class: "pn-in pn-num", key, type: "text", inputmode: "decimal", spellcheck: "false",
      autocomplete: "off", "aria-label": label, value: fmtM(cm), disabled: o.disabled, "data-tip": o.tip,
      on: {
        input() { this._dirty = true; },
        focus() { const el = this; setTimeout(() => { if (document.activeElement === el) el.select(); }, 0); },
        keydown(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            const v = parseM(this.value);
            finish(this, v == null ? null : toCm(v));
            const el = this; setTimeout(() => { if (document.activeElement === el) el.select(); }, 0);
          } else if (e.key === "Escape") {
            e.preventDefault(); this._dirty = false; this.value = this._value; this.blur();
          } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            const v = parseM(this.value);
            const base = v == null ? cm : toCm(v);
            const step = (e.shiftKey ? 50 : 5) * (e.key === "ArrowUp" ? 1 : -1);
            finish(this, base + step);
          }
        },
        blur() { if (this._dirty) { const v = parseM(this.value); finish(this, v == null ? null : toCm(v)); } },
      },
    });
    return h("label", { class: "pn-field" + (o.cls ? " " + o.cls : "") },
      label ? h("span", { class: "pn-field-l" }, label) : null,
      h("span", { class: "pn-in-wrap" }, input, h("span", { class: "pn-unit" }, T.m)));
  }

  /* A text field: commit(text) on Enter / blur; Esc puts the old text back. */
  function tField(key, label, text, commit, opts) {
    const o = opts || {};
    const input = h("input", {
      class: "pn-in" + (o.cls ? " " + o.cls : ""), key, type: "text", spellcheck: "false", autocomplete: "off",
      maxlength: o.max || 60, "aria-label": label, value: text,
      on: {
        input() { this._dirty = true; },
        keydown(e) {
          if (e.key === "Enter") { e.preventDefault(); this.blur(); }
          else if (e.key === "Escape") { e.preventDefault(); this._dirty = false; this.value = this._value; this.blur(); }
        },
        blur() {
          if (!this._dirty) return;
          this._dirty = false;
          const v = this.value.trim();
          if (!v || v === this._value) { this.value = this._value; return; }
          commit(v);
        },
      },
    });
    return h("label", { class: "pn-field" }, label ? h("span", { class: "pn-field-l" }, label) : null, input);
  }

  /* Segmented buttons. opts: [{v, label, tip, dim}] */
  function seg(key, options, current, pick, cls) {
    return h("div", { class: "pn-seg" + (cls ? " " + cls : ""), key, role: "group" },

  // ======================================================== cards
  function card(id, title, right, body, extraCls) {

  function toggleCard(id, force) {

    if (open) delete UI.collapsed[id]; else UI.collapsed[id] = true;
    savePrefs(); renderSidebar();
  }

  // ---------------------------------------------------------------- inspector
  function inspectorCard(P, A) {
    const sel = HP.store.selection();
    let kind = null, body = null, right = null;
    if (sel && sel.kind === "room") {
      const r = roomById(P, sel.id);
      if (r) { kind = T.kRoom; ({ body, right } = roomInspector(P, A, r)); }
    } else if (sel && sel.kind === "opening") {
      const o = P.openings.find(x => x.id === sel.id);
      if (o) { kind = o.kind === "door" ? T.kDoor : T.kWindow; ({ body, right } = openingInspector(P, A, o)); }
    } else if (sel && sel.kind === "section") {
      const sc = P.sections.find(x => x.id === sel.id);
      if (sc) { kind = T.kSection; body = sectionInspector(P, sc); right = sc.label + "\u2013" + sc.label; }
    } else if (sel && sel.kind === "plot" && sel.id != null && P.plot.pts[sel.id]) {
      kind = T.kCorner; body = cornerInspector(P, sel.id); right = String.fromCharCode(65 + sel.id);
    }
    if (!body) {
      body = [h("p", { class: "pn-tip" }, icon("info", 15), h("span", null, T.nothing1)),

  function roomInspector(P, A, r) {
    const ty = HP.ROOM_TYPES[r.type] || {};

      h("span", { class: "pn-dot" }),
      tField("rname-" + id, null, r.name, v => run("renameRoom", [id, v], T.L.rename, "insp"), { cls: "pn-in-name", max: 40 })));
    body.push(h("div", { class: "pn-row2", key: "rsz-" + id },
      mField("rw-" + id, T.width, r.w, v => run("setRoomSize", [id, v, r.h], T.L.roomSize, "insp"), { where: "insp", tip: T.sizeTip }),
      mField("rh-" + id, T.depth, r.h, v => run("setRoomSize", [id, r.w, v], T.L.roomSize, "insp"), { where: "insp", tip: T.sizeTip })));
    body.push(h("div", { class: "pn-kv", key: "rarea-" + id }, h("span", null, T.area),
      h("b", { class: "pn-mono" }, fmtA(area) + " " + T.m2)));

    body.push(h("label", { class: "pn-field", key: "rtype-" + id }, h("span", { class: "pn-field-l" }, T.type),
      h("span", { class: "pn-select" },
        h("select", { class: "pn-in", "aria-label": T.type, value: r.type,
          on: { change() { run("setRoomType", [id, this.value], T.L.type, "insp"); } } },
          HP.ROOM_ORDER.map(t => h("option", { value: t }, typeLabel(t)))),
        icon("chev", 14))));
    // furniture
    let vars = [];
    try { vars = HP.furniture && HP.furniture.variants ? HP.furniture.variants(r.type) || [] : []; } catch (e) { vars = []; }
    if (vars.length > 1) {
      const cur = r.furn | 0;
      body.push(h("div", { class: "pn-field", key: "rfurn-" + id }, h("span", { class: "pn-field-l" }, T.furniture),
        h("div", { class: "pn-chips" }, vars.map((v, i) => h("button", {
          type: "button", key: "fv-" + i, class: "pn-chip" + (i === cur ? " is-on" : ""), "aria-pressed": i === cur ? "true" : "false",
          on: { click() { if (i !== cur) run("setFurniture", [id, i], T.L.furn, "insp"); } },

    body.push(h("div", { class: "pn-field", key: "rops-" + id }, h("span", { class: "pn-field-l" }, T.openingsOf),
      list.length ? h("div", { class: "pn-list" }, list.map(x => h("button", {
        type: "button", key: "op-" + x.id, class: "pn-li" + (x.bad ? " is-bad" : ""),
        on: { click() { HP.store.select({ kind: "opening", id: x.id }); } },
      }, icon(x.kind === "door" ? "door" : "window", 16, "pn-li-ic"),
        h("span", { class: "pn-li-main" }, h("b", null, x.title), h("small", null, x.faces)),
        x.bad ? icon("warn", 14, "pn-li-warn") : null)))

    if (probs.length) body.push(problemBox("rp-" + id, probs));
    body.push(h("div", { class: "pn-actions", key: "ract-" + id },
      btn("rdel-" + id, "trash", T.delRoom, () => run("removeRoom", [id], T.L.delRoom, "insp"), "pn-btn-danger")));
    return { body, right: fmtA(area) + " " + T.m2 };
  }

  function roomOpenings(P, A, r) {
    let items;
    if (A && A.roomOpenings && A.roomOpenings[r.id]) items = A.roomOpenings[r.id].map(x => x.id);
    else items = P.openings.filter(o => o.room === r.id).map(o => o.id);
    return items.map(oid => {
      const o = P.openings.find(x => x.id === oid);
      if (!o) return null;
      const ao = A && A.openings ? A.openings.find(x => x.id === oid) : null;
      const title = fill(o.kind === "door" ? T.doorName : T.winName, { w: fmtM(o.w) });
      return { id: oid, kind: o.kind, title, faces: facingText(P, ao, o, r.id),
               bad: (ao && ao.ok === false) || issuesOf(A, oid).length > 0 };
    }).filter(Boolean);
  }
  function facingText(P, ao, o, fromRoom) {
    if (!ao) return fill(T.inRoom, { name: roomName(P, o.room) });
    if (fromRoom && ao.room !== fromRoom) return fill(T.toRoom, { name: roomName(P, ao.room) });
    switch (ao.facing) {
      case "room": return fill(T.toRoom, { name: roomName(P, ao.other) });
      case "open": return fill(T.ontoOpen, { name: roomName(P, ao.other) });
      case "yard": return T.ontoYard;
      case "street": return T.ontoStreet;
      case "neighbour": return T.ontoNeighbour;
      case "blocked": return T.blocked;
      default: return "";
    }
  }
  function issuesOf(A, id) {
    if (!A || !A.issues || !A.issues[id]) return [];
    return A.issues[id].map(rid => (A.rules || []).find(r => r.id === rid) || { id: rid, title: rid, detail: "" });
  }
  function problemBox(key, rules, extra) {
    return h("div", { class: "pn-probs", key },
      h("span", { class: "pn-field-l" }, T.problems),
      extra ? h("div", { class: "pn-prob" }, icon("warn", 14), h("span", null, extra)) : null,
      rules.map(r => h("div", { class: "pn-prob", key: "pr-" + r.id }, icon("warn", 14),
        h("span", null, h("b", null, r.title), r.detail ? h("small", null, r.detail) : null))));
  }

  // which way is "left" for a door: seen from inside the host room, facing the wall
  const startIsLeft = side => side === "N" || side === "W";

  function openingInspector(P, A, o) {
    const id = o.id, host = roomById(P, o.room);
    const ao = A && A.openings ? A.openings.find(x => x.id === id) : null;
    const body = [];
    const sizes = o.kind === "door" ? HP.DOOR_SIZES : HP.WINDOW_SIZES;
    let range = null, note = null;
    if (o.kind === "window" && host) {
      const ty = HP.ROOM_TYPES[host.type];
      range = ty && ty.win;
      const tl = ty ? ty.label : host.type;
      note = !range ? fill(T.winNone, { type: tl })
        : range[0] === range[1] ? fill(T.winOne, { type: tl, a: fmtM(range[0]) })
        : fill(T.winRange, { type: tl, a: fmtM(range[0]), b: fmtM(range[1]) });
    }
    body.push(h("div", { class: "pn-kv", key: "ohost-" + id }, h("span", null, T.hostRoom),
      h("b", null, host ? host.name : "?")));
    body.push(h("div", { class: "pn-field", key: "osz-" + id }, h("span", { class: "pn-field-l" }, T.size),
      seg("osz-" + id, sizes.map(w => ({ v: w, label: fmtM(w),
        dim: !!(range && (w < range[0] || w > range[1])) || (o.kind === "window" && !range) })),
        o.w, w => run("setOpening", [id, { w }], T.L.opening, "insp"), sizes.length > 4 ? "pn-seg-wrap" : ""),
      note ? h("small", { class: "pn-note" }, note) : null));
    if (o.kind === "door") {
      const sl = startIsLeft(o.side);
      const leftV = sl ? "start" : "end", rightV = sl ? "end" : "start";
      body.push(h("div", { class: "pn-row2", key: "odoor-" + id },
        h("div", { class: "pn-field" }, h("span", { class: "pn-field-l" }, T.opens),
          seg("osw-" + id, [{ v: "in", label: T.swingIn, tip: T.swingInTip }, { v: "out", label: T.swingOut, tip: T.swingOutTip }], o.swing || "in",
            v => run("setOpening", [id, { swing: v }], T.L.opening, "insp"))),
        h("div", { class: "pn-field" }, h("span", { class: "pn-field-l", "data-tip": T.hingeTip }, T.hinge),
          seg("ohi-" + id, [{ v: leftV, label: T.left, tip: T.hingeTip }, { v: rightV, label: T.right, tip: T.hingeTip }],
            o.hinge || "start", v => run("setOpening", [id, { hinge: v }], T.L.opening, "insp")))));
    }
    const faces = facingText(P, ao, o, null);
    const bad = ao && ao.ok === false;
    if (faces) body.push(h("div", { class: "pn-kv" + (bad || (ao && (ao.facing === "neighbour" || ao.facing === "blocked")) ? " is-bad" : ""), key: "ofc-" + id },
      h("span", null, T.faces), h("b", null, faces)));
    const probs = issuesOf(A, id);
    if (probs.length || (bad && ao.reason)) body.push(problemBox("op-" + id, probs, bad ? ao.reason : null));
    body.push(h("div", { class: "pn-actions", key: "oact-" + id },
      btn("odel-" + id, "trash", o.kind === "door" ? T.delDoor : T.delWindow,
        () => run("removeOpening", [id], T.L.delOpening, "insp"), "pn-btn-danger")));
    return { body, right: fmtM(o.w) + " " + T.m };
  }

  function sectionInspector(P, sc) {
    const id = sc.id;
    return [

  // ---------------------------------------------------------------- land
  function plotBox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    return { x0, y0, x1, y1, w: x1 - x0, d: y1 - y0 };
  }
  function isRect(pts) {
    if (pts.length !== 4) return false;

      const a = pts[i], b = pts[(i + 1) % 4], c = pts[(i + 2) % 4];
      const h1 = a[1] === b[1], v1 = a[0] === b[0], h2 = b[1] === c[1], v2 = b[0] === c[0];
      if (!((h1 && v2) || (v1 && h2))) return false;
    }
    return true;
  }

        h("span", { class: "pn-switch" }), icon("corner", 15), h("span", null, plotting ? T.doneCorners : T.editCorners)),
      h("small", { class: "pn-muted" }, plotting ? T.cornersHelpOn : T.cornersHelpOff)));

          mField("cy-" + i, null, p[1], v => run("movePlotCorner", [i, [p[0], v]], T.L.corner, "land"), { where: "land", tip: T.yTip, cls: "pn-field-y" }),
          h("button", { type: "button", class: "pn-icon-btn", "data-tip": fill(T.addCorner, { c }), "aria-label": fill(T.addCorner, { c }),
