<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furniture sheet</title>
<style>
  :root { --bg: #0f1620; --panel: #152030; --ink: #cfd6e4; --dim: #7d8aa0; --line: #24344a; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header label { color: var(--dim); }
  h2 { font-size: 14px; margin: 22px 18px 8px; font-weight: 600; color: #9a9ae4; }
  h3 { font-size: 13px; margin: 14px 18px 6px; font-weight: 600; color: var(--dim); }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .card canvas { display: block; }
  .cap { margin-top: 6px; max-width: 420px; }
  .cap b { font-weight: 600; }
  .cap .s { color: var(--dim); font-size: 12px; }
  .warn { color: #e0a060; }
  .bad { color: #ff6b6b; font-weight: 600; }
  #summary { padding: 0 18px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Furniture blocks and automatic layouts</h1>
  <label><input type="checkbox" id="zones" checked> show door / window keep-out zones</label>
  <label><input type="checkbox" id="boxes"> show block boxes</label>
  <span id="summary"></span>
</header>
<div id="out"></div>
<script>
  // load the modules fresh every time (embedded browser panes cache hard)
  for (const m of ["core", "analyze", "furniture"])
    document.write('<script src="../src/' + m + '.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
"use strict";
(function () {
  const F = HP.furniture, LAY = HP.LAYERS, BG = "#0f1620";
  const DPR = Math.max(1, window.devicePixelRatio || 1);
  const out = document.getElementById("out");
  const opt = { zones: true, boxes: false };
  // URL options (for close inspection): ?bs=4 block scale px/cm, ?rs=1.2 room scale, ?sec=1,2 sections,
  // ?type=kitchen room types, ?group=Living block groups
  const Q = new URLSearchParams(location.search);
  const BS = +Q.get("bs") || 1.6, RS = +Q.get("rs") || 0;
  const SEC = Q.get("sec") ? Q.get("sec").split(",") : ["1", "2", "3", "4"];
  const TYPES = Q.get("type") ? Q.get("type").split(",") : null, GROUPS = Q.get("group") ? Q.get("group").split(",") : null;
  const ROT = { 0: [1, 0], 90: [0, 1], 180: [-1, 0], 270: [0, -1] };

  // ------------------------------------------------------------ drawing primitives (local units)
  function prims(ctx, items, s, color) {
    for (const it of items) {
      const L = LAY[it.layer] || LAY["A-FURN"];
      ctx.strokeStyle = color || L.color;
      const lw = it.lw != null ? it.lw : L.lw;
      ctx.lineWidth = Math.max(0.6, lw * 5) / s;
      ctx.beginPath();
      if (it.kind === "line") { ctx.moveTo(it.a[0], it.a[1]); ctx.lineTo(it.b[0], it.b[1]); }
      else if (it.kind === "circle") { ctx.moveTo(it.c[0] + it.r, it.c[1]); ctx.arc(it.c[0], it.c[1], it.r, 0, Math.PI * 2); }
      else if (it.kind === "arc") ctx.arc(it.c[0], it.c[1], it.r, it.a0 * Math.PI / 180, it.a1 * Math.PI / 180, false);
      else if (it.kind === "pline") {
        const P = it.pts, B = it.bulges, n = P.length, segs = it.closed ? n : n - 1;
        ctx.moveTo(P[0][0], P[0][1]);
        for (let i = 0; i < segs; i++) {
          const p = P[i], q = P[(i + 1) % n], b = B ? B[i] : 0;
          if (Math.abs(b) < 1e-12) { ctx.lineTo(q[0], q[1]); continue; }
          const th = 4 * Math.atan(b), c = Math.hypot(q[0] - p[0], q[1] - p[1]);
          const r = c / (2 * Math.sin(th / 2));
          const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, nx = -(q[1] - p[1]) / c, ny = (q[0] - p[0]) / c;
          const d = r * Math.cos(th / 2), cx = mx + nx * d, cy = my + ny * d;
          ctx.arc(cx, cy, Math.abs(r), Math.atan2(p[1] - cy, p[0] - cx), Math.atan2(q[1] - cy, q[0] - cx), b < 0);
        }
        if (it.closed) ctx.closePath();
      }
      ctx.stroke();
    }
  }
  function insert(ctx, ins, s) {
    const B = F.BLOCKS[ins.block];
    ctx.save();
    ctx.translate(ins.x, ins.y); ctx.rotate(ins.rot * Math.PI / 180); ctx.scale(ins.sx, 1);
    prims(ctx, B.items, s);
    if (opt.boxes) { ctx.strokeStyle = "rgba(255,255,0,0.35)"; ctx.lineWidth = 0.6 / s; ctx.strokeRect(0, 0, B.w, B.h); }
    ctx.restore();
  }
  // a canvas whose drawing space is world cm, y up, fitted to [x0,y0]-[x1,y1] at s px/cm
  function stage(x0, y0, x1, y1, s, pad) {
    pad = pad == null ? 8 : pad;
    const cv = document.createElement("canvas");
    const W = Math.ceil((x1 - x0) * s + 2 * pad), H = Math.ceil((y1 - y0) * s + 2 * pad);
    cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + "px"; cv.style.height = H + "px";
    const ctx = cv.getContext("2d");
    ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(s * DPR, 0, 0, -s * DPR, (pad - x0 * s) * DPR, (pad + y1 * s) * DPR);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    return { cv, ctx };
  }
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  // ------------------------------------------------------------ a room with walls, openings, furniture
  function bandOf(room, side, s0, s1, depth) {
    switch (side) {
      case "N": return [s0, room.y + room.h - depth, s1, room.y + room.h];
      case "S": return [s0, room.y, s1, room.y + depth];
      case "E": return [room.x + room.w - depth, s0, room.x + room.w, s1];
      case "W": return [room.x, s0, room.x + depth, s1];
    }
  }
  function drawRoom(ctx, room, ops, L, s, t) {
    t = t || 20;
    const x0 = room.x, y0 = room.y, x1 = room.x + room.w, y1 = room.y + room.h;
    // wall band
    ctx.fillStyle = "rgba(140,47,47,0.55)";
    ctx.beginPath(); ctx.rect(x0 - t, y0 - t, room.w + 2 * t, room.h + 2 * t); ctx.rect(x0, y0, room.w, room.h); ctx.fill("evenodd");
    ctx.strokeStyle = LAY["A-WALL"].color; ctx.lineWidth = 1.4 / s;
    ctx.strokeRect(x0 - t, y0 - t, room.w + 2 * t, room.h + 2 * t); ctx.strokeRect(x0, y0, room.w, room.h);
    for (const o of ops) {
      const ax = o.side === "N" || o.side === "S";
      const f = o.side === "N" ? y1 : o.side === "S" ? y0 : o.side === "E" ? x1 : x0;
      const n = o.side === "N" || o.side === "E" ? 1 : -1;
      const P = (a, q) => (ax ? [a, q] : [q, a]);
      // cut the wall
      ctx.fillStyle = BG;
      const r0 = P(o.s0, f), r1 = P(o.s1, f + n * t);
      ctx.fillRect(Math.min(r0[0], r1[0]), Math.min(r0[1], r1[1]), Math.abs(r1[0] - r0[0]), Math.abs(r1[1] - r0[1]));
      if (o.kind === "window") {
        ctx.strokeStyle = LAY["A-GLAZ"].color; ctx.lineWidth = 1 / s;
        for (const k of [0, 0.5, 1]) { ctx.beginPath(); const a = P(o.s0, f + n * t * k), b = P(o.s1, f + n * t * k); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); }
      } else {
        const hinge = o.hingeAt === "s1" ? o.s1 : o.s0, free = hinge === o.s1 ? o.s0 : o.s1, w = o.s1 - o.s0;
        const dir = o.swingInto ? -n : n;            // into this room or away
        const base = o.swingInto ? f : f + n * t;
        const h = P(hinge, base), tip = P(hinge, base + dir * w), fr = P(free, base);
        ctx.strokeStyle = LAY["A-DOOR"].color; ctx.lineWidth = 1.2 / s;
        ctx.beginPath(); ctx.moveTo(...h); ctx.lineTo(...tip); ctx.stroke();
        ctx.strokeStyle = HP.COLORS.swing; ctx.lineWidth = 0.8 / s;
        const a0 = Math.atan2(fr[1] - h[1], fr[0] - h[0]), a1 = Math.atan2(tip[1] - h[1], tip[0] - h[0]);
        let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
        ctx.beginPath(); ctx.arc(h[0], h[1], w, a0, a1, d < 0); ctx.stroke();
      }
      if (opt.zones) {
        const z = o.kind === "door" ? bandOf(room, o.side, o.s0, o.s1, o.swingInto ? Math.max(w0(o), 60) : 60) : bandOf(room, o.side, o.s0, o.s1, 60);
        ctx.fillStyle = o.kind === "door" ? "rgba(255,90,90,0.10)" : "rgba(46,155,214,0.10)";
        ctx.fillRect(z[0], z[1], z[2] - z[0], z[3] - z[1]);
      }
    }
    for (const ins of L.inserts) insert(ctx, ins, s);
  }
  const w0 = o => o.s1 - o.s0;
  // openings in roomOpenings form (s0/s1 absolute) from an easy description
  function ops(room, list) {
    return list.map((o, i) => {
      const len = o.side === "N" || o.side === "S" ? room.w : room.h, st = o.side === "N" || o.side === "S" ? room.x : room.y;
      let at = o.at === "end" ? len - 20 - o.w : o.at === "mid" ? Math.round((len - o.w) / 10) * 5 : (o.at == null ? 20 : o.at);
      return { id: "o" + i, kind: o.kind, side: o.side, s0: st + at, s1: st + at + o.w, w: o.w,
        swingInto: o.kind === "door" && o.into !== false, hingeAt: o.kind === "door" ? (o.hinge === "end" ? "s1" : "s0") : null };
    });
  }
  // independent rule check (same rules as test/furniture.test.js)
  function breaks(room, op, L) {
    const ov = (a, b) => a[0] < b[2] - 1e-6 && b[0] < a[2] - 1e-6 && a[1] < b[3] - 1e-6 && b[1] < a[3] - 1e-6;
    const doors = op.filter(o => o.kind === "door").map(o => bandOf(room, o.side, o.s0, o.s1, o.swingInto ? Math.max(w0(o), 60) : 60));
    const wins = op.filter(o => o.kind === "window").map(o => bandOf(room, o.side, o.s0, o.s1, 60));
    const P = L.inserts.map(i => ({ i, B: F.BLOCKS[i.block], parts: F.blockParts(i), box: F.blockBox(i) }));
    const bad = [];
    for (const p of P) {
      if (p.box[0] < room.x - 1e-6 || p.box[1] < room.y - 1e-6 || p.box[2] > room.x + room.w + 1e-6 || p.box[3] > room.y + room.h + 1e-6) bad.push(p.i.block + " outside");
      for (const q of p.parts) { if (doors.some(z => ov(q, z))) bad.push(p.i.block + " in door zone"); if (p.B.tall && wins.some(z => ov(q, z))) bad.push(p.i.block + " over window"); }
    }
    for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) if (P[a].parts.some(x => P[b].parts.some(y => ov(x, y)))) bad.push(P[a].i.block + " x " + P[b].i.block);
    return bad;
  }
  let total = 0, totalBad = 0;
  function roomCard(parent, type, w, h, list, furn, title) {
    const room = { id: "r", type, x: 0, y: 0, w, h };
    const op = ops(room, list);
    const L = F.layout(room, op, furn, { cache: false });
    const s = RS || Math.min(0.62, 300 / Math.max(w, h));
    const { cv, ctx } = stage(-22, -22, w + 22, h + 22, s, 6);
    drawRoom(ctx, room, op, L, s);
    const bad = breaks(room, op, L);
    total++; if (bad.length) totalBad++;
    const card = el("div", "card"); card.appendChild(cv);
    const vl = F.variants(type)[furn].label;
    card.appendChild(el("div", "cap",
      "<b>" + (title || HP.ROOM_TYPES[type].label) + "</b> " + (w / 100).toFixed(2) + " x " + (h / 100).toFixed(2) + " m" +
      "<div class='s'>" + vl + (furn === 0 ? " &rarr; " + L.label : "") + " &middot; " + L.inserts.length + " pieces</div>" +
      (L.dropped.length ? "<div class='s warn'>dropped: " + L.dropped.join(", ") + "</div>" : "") +
      (L.skipped.length ? "<div class='s'>left out: " + L.skipped.join(", ") + "</div>" : "") +
      (bad.length ? "<div class='bad'>RULE BREAK: " + bad.join("; ") + "</div>" : "")));
    parent.appendChild(card);
  }

  function render() {
    out.innerHTML = ""; total = 0; totalBad = 0;
    // ---------------------------------------------------------- 1. the blocks
    if (SEC.includes("1")) {
    out.appendChild(el("h2", null, "1. Blocks (" + Object.keys(F.BLOCKS).length + "), 1:50-ish, back of each piece at the top"));
    const groups = {};
    for (const [name, B] of Object.entries(F.BLOCKS)) (groups[B.group || "Other"] = groups[B.group || "Other"] || []).push([name, B]);
    for (const [g, list] of Object.entries(groups)) {
      if (GROUPS && !GROUPS.includes(g)) continue;
      out.appendChild(el("h3", null, g));
      const grid = el("div", "grid");
      for (const [name, B] of list) {
        const s = BS;
        const { cv, ctx } = stage(0, 0, B.w, B.h, s, 10);
        prims(ctx, B.items, s);
        if (opt.boxes) { ctx.strokeStyle = "rgba(255,255,0,0.35)"; ctx.lineWidth = 0.6 / s; ctx.strokeRect(0, 0, B.w, B.h); }
        const card = el("div", "card"); card.appendChild(cv);
        card.appendChild(el("div", "cap", "<b>" + name + "</b><div class='s'>" + B.label + " &middot; " + B.w + " x " + B.h + " cm &middot; " + B.layer + (B.tall ? " &middot; tall" : "") + "</div>"));
        grid.appendChild(card);
      }
      out.appendChild(grid);
    }
    // ---------------------------------------------------------- 2. layouts per room type
    }
    if (SEC.includes("2")) {
    out.appendChild(el("h2", null, "2. Automatic layouts and every variant (red tint = door swing + 60 cm; blue = 60 cm window strip tall pieces avoid)"));
    const ex = {
      bedroom:   { sizes: [[300, 300], [310, 440], [360, 400], [450, 500]], list: [{ kind: "door", side: "S", w: 80 }, { kind: "window", side: "S", at: 140, w: 120 }] },
      living:    { sizes: [[330, 360], [420, 470], [500, 600]], list: [{ kind: "door", side: "S", at: 40, w: 100 }, { kind: "window", side: "S", at: 200, w: 150 }, { kind: "door", side: "N", at: "end", w: 80, hinge: "end" }] },
      reception: { sizes: [[340, 380], [400, 450], [480, 620]], list: [{ kind: "door", side: "W", at: 30, w: 100 }, { kind: "window", side: "S", at: "mid", w: 200 }] },
      kitchen:   { sizes: [[180, 300], [260, 470], [300, 400], [380, 420]], list: [{ kind: "window", side: "S", at: 55, w: 150 }, { kind: "door", side: "N", w: 80 }] },
      bath:      { sizes: [[160, 200], [200, 250], [240, 270]], list: [{ kind: "door", side: "N", w: 80 }, { kind: "window", side: "N", at: "end", w: 60 }] },
      wc:        { sizes: [[100, 150], [130, 180], [240, 180]], list: [{ kind: "door", side: "S", w: 80 }, { kind: "window", side: "N", at: "mid", w: 60 }] },
      open:      { sizes: [[200, 300], [960, 210], [400, 400]], list: [{ kind: "door", side: "S", at: 40, w: 80, into: false }, { kind: "door", side: "N", at: "mid", w: 80, into: false }, { kind: "window", side: "N", at: "end", w: 120 }] },
      hall:      { sizes: [[160, 400], [120, 300]], list: [{ kind: "door", side: "S", at: "mid", w: 100 }, { kind: "door", side: "E", at: 40, w: 80 }] },
    };
    for (const type of HP.ROOM_ORDER) {
      if (TYPES && !TYPES.includes(type)) continue;
      const e = ex[type];
      out.appendChild(el("h3", null, HP.ROOM_TYPES[type].label + " - Automatic at several sizes"));
      let grid = el("div", "grid");
      for (const [w, h] of e.sizes) roomCard(grid, type, w, h, e.list, 0);
      out.appendChild(grid);
      out.appendChild(el("h3", null, HP.ROOM_TYPES[type].label + " - each variant at " + (e.sizes[e.sizes.length - 1][0] / 100).toFixed(2) + " x " + (e.sizes[e.sizes.length - 1][1] / 100).toFixed(2) + " m"));
      grid = el("div", "grid");
      const [w, h] = e.sizes[e.sizes.length - 1];
      for (let v = 1; v < F.variants(type).length; v++) roomCard(grid, type, w, h, e.list, v);
      out.appendChild(grid);
    }
    // ---------------------------------------------------------- 3. odd openings (furniture must move)
    }
    if (SEC.includes("3")) {
    out.appendChild(el("h2", null, "3. The same bedroom as its door and window move"));
    let grid = el("div", "grid");
    const moves = [
      [{ kind: "door", side: "S", w: 80 }, { kind: "window", side: "N", at: "mid", w: 120 }],
      [{ kind: "door", side: "E", at: "mid", w: 80 }, { kind: "window", side: "W", at: "mid", w: 150 }],
      [{ kind: "door", side: "N", at: "end", w: 80, hinge: "end", into: false }, { kind: "window", side: "S", at: "mid", w: 120 }],
      [{ kind: "door", side: "W", at: 20, w: 80 }, { kind: "window", side: "E", at: 20, w: 120 }, { kind: "window", side: "N", at: "mid", w: 100 }],
    ];
    for (const m of moves) roomCard(grid, "bedroom", 360, 400, m, 0);
    for (const m of moves) roomCard(grid, "kitchen", 300, 380, m, 0);
    out.appendChild(grid);
    // ---------------------------------------------------------- 4. the sample house through the real analyze()
    }
    if (SEC.includes("4") && typeof HP.analyze === "function") {
      out.appendChild(el("h2", null, "4. test/fixtures/sample-house.json through HP.analyze + HP.furniture.layout"));
      const g = el("div", "grid");
      const card = el("div", "card");
      g.appendChild(card); out.appendChild(g);
      fetch("../test/fixtures/sample-house.json", { cache: "no-store" }).then(r => r.json()).then(plan => {
        const A = HP.analyze(plan), s = 0.62;
        const { cv, ctx } = stage(-30, 680, 1030, 1930, s, 6);
        let bad = [];
        for (const r of A.rooms) {
          const op = A.roomOpenings[r.id] || [];
          const L = F.layout(r, op, 0);
          drawRoom(ctx, r, op.filter(o => o.host), L, s);
          bad = bad.concat(breaks(r, op, L).map(b => r.id + " " + b));
        }
        card.appendChild(cv);
        card.appendChild(el("div", "cap", "<b>Sample courtyard house</b> - every room on Automatic" + (bad.length ? "<div class='bad'>" + bad.join("; ") + "</div>" : "<div class='s'>no rule breaks</div>")));
      }).catch(e => card.appendChild(el("div", "bad", "could not load the sample: " + e)));
    }
    document.getElementById("summary").textContent = total + " example layouts drawn, " + totalBad + " with a rule break";
  }
  document.getElementById("zones").addEventListener("change", e => { opt.zones = e.target.checked; render(); });
  document.getElementById("boxes").addEventListener("change", e => { opt.boxes = e.target.checked; render(); });
  try { render(); } catch (e) { out.appendChild(el("pre", "bad", String(e.stack || e))); }
})();
</script>
</body>
</html>
